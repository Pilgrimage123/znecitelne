<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1f3348" />
<meta name="description" content="Lokální anonymizace dokumentů pro české státní firmy a přípravu textu pro veřejnou AI. Jeden HTML soubor. Žádný cloud." />
<title>Znečitelně</title>
<style>
:root {
  --bg: #f3efe6; --bg-subtle: #e3dcc9; --surface: #fffcf6; --fg: #14161a;
  --muted: #464e57; --border: #b9ae94; --primary: #1a2c40; --on-primary: #ffffff;
  --accent: #2c4658; --danger: #7a1f1f; --ok: #1e5a3f; --hit: #a8460f;
  --focus: #0f5fa8;
  --header-bg: #1a2c40; --header-fg: #ffffff; --header-muted: #d7e0e8;
  --overlay: rgba(14,16,20,.6); --bar-bg: color-mix(in srgb, var(--surface) 97%, transparent);
  --radius: 12px; --font: "Segoe UI", "Source Sans 3", system-ui, sans-serif;
  --display: Georgia, "Times New Roman", serif; --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #12161c; --bg-subtle: #1b222c; --surface: #1c2430; --fg: #e8e4d8;
  --muted: #9aa4b0; --border: #3a4656; --primary: #c9b896; --on-primary: #14161a;
  --accent: #8fb4c9; --danger: #e07a6a; --ok: #6fbf96; --hit: #e09a5a;
  --focus: #7eb6e8;
  --header-bg: #0d1218; --header-fg: #e8e4d8; --header-muted: #9aa4b0;
  --overlay: rgba(6,8,12,.72); --bar-bg: color-mix(in srgb, var(--surface) 92%, transparent);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
button:not(:disabled) { cursor: pointer; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header.app :focus-visible { outline-color: #ffd166; }
h1, h2 { font-family: var(--display); font-weight: 600; }
header.app {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; padding: 12px 20px; background: var(--header-bg); color: var(--header-fg);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); color: var(--primary); display: grid; place-items: center; font-weight: 700; }
.tag { margin: 0; font-size: 12px; color: var(--header-muted); }
.hdr-actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent;
  background: var(--primary); color: var(--on-primary); font-weight: 500;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn-ghost { background: transparent; color: var(--header-fg); border-color: color-mix(in srgb, var(--header-fg) 40%, transparent); }
.btn-ghost:hover { background: color-mix(in srgb, var(--header-fg) 16%, transparent); border-color: color-mix(in srgb, var(--header-fg) 60%, transparent); }
.btn-sec { background: var(--surface); color: var(--fg); border: 1.5px solid var(--border); }
.btn-sec:hover { background: var(--bg-subtle); border-color: var(--accent); }
.btn-file {
  background: var(--surface); color: var(--primary); border-color: var(--surface);
  font-weight: 650; box-shadow: 0 0 0 2px rgba(246,241,232,.35);
}
.btn-file:hover { background: #fff; }
.btn-file .plus { font-size: 18px; line-height: 1; font-weight: 700; }
@media (max-width: 640px) {
  #lblNewFile { display: none; }
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; }
.grid-landing { display: grid; gap: 32px; }
@media (min-width: 900px) { .grid-landing { grid-template-columns: 1.1fr .9fr; align-items: start; } }
.kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1.hero { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; margin: 12px 0; font-weight: 500; }
.lead { max-width: 36rem; color: var(--muted); }
ol.steps { padding: 0; margin: 28px 0; list-style: none; }
ol.steps li { display: flex; gap: 12px; margin: 12px 0; }
.num { width: 28px; height: 28px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 12px; flex: none; }
.card { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: 0 0 0 1.5px var(--border), 0 12px 40px rgba(20,22,26,.12); }
.drop {
  border: 2px dashed #8a806a; border-radius: 12px; background: var(--bg); padding: 40px 20px; text-align: center; cursor: pointer;
}
.drop.over { border-color: var(--accent); background: var(--bg-subtle); border-style: solid; }
.stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
details.settings { margin-top: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
label.field, .lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
select, input[type=text], textarea {
  width: 100%; min-height: 44px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg);
  padding: 8px 12px; font: inherit;
}
select:focus, input[type=text]:focus, textarea:focus { border-color: var(--focus); }
textarea { min-height: 80px; font-family: var(--mono); font-size: 13px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.cats label { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
.help-i {
  display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 99px;
  border: 1.5px solid var(--muted); font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface);
}
.privacy { display: flex; gap: 8px; color: var(--fg); font-size: 14px; margin-top: 28px; }
.review { max-width: 1400px; margin: 0 auto; padding: 16px 16px 120px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; border: 1.5px solid var(--border); background: var(--bg-subtle); padding: 4px 10px; font-size: 12px; color: var(--fg); font-family: var(--mono); font-weight: 600; }
.ok { color: var(--ok); font-weight: 600; } .danger { color: var(--danger); font-weight: 600; }
.work { display: grid; gap: 16px; }
@media (min-width: 1100px) { .work { grid-template-columns: minmax(0,1fr) 340px; } }
.pane { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: 0 0 0 1.5px var(--border); }
pre.doc { max-height: min(70dvh, 640px); overflow: auto; white-space: pre-wrap; word-break: break-word; font: 13px/1.65 var(--mono); margin: 0; color: var(--fg); }
pre.doc button.mk { border: 1.5px solid transparent; border-radius: 3px; padding: 1px 3px; font: inherit; color: var(--fg); }
.mk-on { background: #f3c9a8; background: color-mix(in srgb, var(--hit) 45%, white); border-color: #8a3a12; border-color: color-mix(in srgb, var(--hit) 70%, black); font-weight: 600; }
.mk-off { background: #c5e4d4; background: color-mix(in srgb, var(--ok) 35%, white); border-color: #1e5a3f; border-color: color-mix(in srgb, var(--ok) 60%, black); }
.mk-sel { outline: 3px solid var(--focus); outline-offset: 1px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); color: var(--fg); padding: 0 12px; font-size: 13px; font-weight: 500; }
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.hits { max-height: 42dvh; overflow: auto; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--border); }
.hit { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--fg); padding: 10px 12px; font: inherit; }
.hit.sel { background: var(--bg-subtle); box-shadow: inset 3px 0 0 var(--accent); }
.mono { font-family: var(--mono); font-size: 12px; }
.pill { border-radius: 999px; padding: 2px 8px; font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: .03em; }
.pill-hit { background: var(--hit); color: #fff; }
.pill-ok { background: var(--ok); color: #fff; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-top: 2px solid var(--border);
  background: var(--bar-bg); backdrop-filter: blur(8px);
  padding: 10px 16px;
}
.bar-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px; font-size: 14px; }
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--overlay); padding: 16px; }
.sheet { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 12px 40px rgba(14,16,20,.3); }
.hidden { display: none !important; }
footer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 16px 24px; }
kbd { display: inline-block; min-width: 1.4rem; padding: .1rem .4rem; border-radius: 4px; border: 1.5px solid var(--muted); background: var(--surface); color: var(--fg); font: 11px/1.4 var(--mono); font-weight: 700; text-align: center; }
#tip {
  position: fixed; z-index: 80; max-width: 280px; padding: 8px 12px; border-radius: 8px;
  background: var(--primary); color: var(--on-primary); font-size: 12px; line-height: 1.4;
  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s;
  box-shadow: 0 8px 24px rgba(31,51,72,.18);
}
#tip.on { opacity: 1; transform: none; }
.toast {
  position: fixed; right: 16px; bottom: 80px; z-index: 50; background: var(--primary); color: var(--on-primary);
  padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none;
}
.process { font-size: 13px; line-height: 1.45; max-height: 22rem; overflow: auto; }
.process h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; font-family: var(--font); }
.process ul { margin: 0; padding-left: 1.1rem; }
.process .token { font-family: var(--mono); font-size: 12px; }
.leak-ok { color: var(--ok); }
.leak-bad { color: var(--danger); }
.layer-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.dict-hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

body.movie-active header.app,
body.movie-active .bar { pointer-events: none; }
body.movie-active .drop,
body.movie-active #btnSample,
body.movie-active #btnBrowse { pointer-events: none; }
#movie-caption-bar {
  display: none; position: fixed; left: 16px; right: 16px; bottom: 72px; z-index: 70;
  max-width: 720px; margin: 0 auto; padding: 12px 16px; border-radius: 14px;
  background: color-mix(in srgb, var(--header-bg) 92%, transparent);
  color: var(--header-fg); box-shadow: 0 12px 40px rgba(14,16,20,.28);
  border: 1px solid color-mix(in srgb, var(--header-fg) 22%, transparent);
}
#movie-caption-bar.active { display: block; }
#movie-chapter-label {
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--header-muted); margin-bottom: 4px;
}
#movie-caption-text { font-size: 15px; line-height: 1.45; }
.action-marquee {
  overflow: hidden;
  white-space: nowrap;
  width: 100%;
}
.action-marquee-inner { display: inline-block; }
.action-marquee.marquee-active .action-marquee-inner {
  padding-left: 100%;
  animation: actionMarqueeScroll var(--marquee-duration, 10s) linear infinite;
}
@keyframes actionMarqueeScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}
.chip-track {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  animation: chipMarquee var(--chip-marquee-duration, 8s) linear infinite;
}
.chip-content-clone { margin-left: 32px; }
@keyframes chipMarquee {
  from { transform: translateX(0); }
  to { transform: translateX(calc(-1 * var(--chip-marquee-shift, 0px))); }
}
.hit-value.marquee, .insp-marquee.marquee {
  overflow: hidden;
  display: block;
  max-width: 100%;
}
body.movie-paused .action-marquee-inner,
body.movie-paused .chip-track,
body.movie-paused .movie-pulse {
  animation-play-state: paused !important;
}
@media (prefers-reduced-motion: reduce) {
  .action-marquee.marquee-active .action-marquee-inner,
  .chip-track { animation: none !important; padding-left: 0; }
}
#movie-controls {
  display: none; position: fixed; right: 16px; bottom: 16px; z-index: 71;
  gap: 6px; align-items: center;
}
#movie-controls.active { display: flex; }
#movie-controls button {
  min-height: 40px; padding: 0 12px; border-radius: 999px;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--fg);
  font: 13px/1 var(--font); font-weight: 600;
}
#movie-title-card {
  display: none; position: fixed; inset: 0; z-index: 72; place-items: center;
  background: var(--overlay); padding: 24px;
}
#movie-title-card.show { display: grid; }
#movie-title-card .sheet { text-align: center; max-width: 420px; }
#movie-title-card h2 { margin: 0 0 8px; font-size: 1.6rem; }
.movie-pulse {
  outline: 3px solid var(--focus) !important;
  animation: moviePulse 1.1s ease-in-out infinite;
  position: relative; z-index: 5;
}
@keyframes moviePulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--focus) 50%, transparent); }
  50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--focus) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce) {
  .movie-pulse { animation: none; }
}
</style>
</head>
<body>
<div id="tip" role="tooltip"></div>
<div class="toast" id="toast"></div>
<div id="movie-caption-bar" aria-live="polite">
  <div id="movie-chapter-label"></div>
  <div id="movie-caption-text" class="action-marquee"><span class="action-marquee-inner" id="movie-caption-inner"></span></div>
</div>
<div id="movie-controls">
  <button type="button" id="movie-btn-back" disabled>⏮️</button>
  <button type="button" id="movie-btn-playpause">⏸️</button>
  <button type="button" id="movie-btn-skip">⏭️</button>
  <button type="button" id="movie-btn-speed">1×</button>
  <button type="button" id="movie-btn-exit">✖️</button>
</div>
<div id="movie-title-card"><div class="sheet"><h2 id="movie-title-h"></h2><p id="movie-title-p" style="color:var(--muted)"></p></div></div>
<header class="app">
  <div class="brand">
    <div class="mark">Z</div>
    <div>
      <h1 style="margin:0;font-size:18px" id="title">Znečitelně</h1>
      <p class="tag" id="tagline"></p>
    </div>
  </div>
  <div class="hdr-actions">
    <button class="btn btn-sm btn-file" id="btnNewFile" type="button"><span class="plus" aria-hidden="true">+</span><span id="lblNewFile">Nový soubor</span></button>
    <button class="btn btn-sm btn-ghost" id="btnTheme" type="button" aria-pressed="false" aria-label="Tmavý režim">☾</button>
    <button class="btn btn-sm btn-ghost" id="btnSettings" type="button" aria-label="Nastavení">⚙</button>
    <button class="btn btn-sm btn-ghost" id="btnHtml" type="button">HTML</button>
    <button class="btn btn-sm btn-ghost" id="btnLang" type="button">EN</button>
    <button class="btn btn-sm btn-ghost" id="btnHelp" type="button">?</button>
  </div>
</header>

<section id="landing" class="wrap">
  <div class="grid-landing">
    <div>
      <p class="kicker" id="kicker"></p>
      <h1 class="hero" id="hero">Znečitelně</h1>
      <p class="lead" id="lead"></p>
      <ol class="steps">
        <li><span class="num">1</span><span id="s1"></span></li>
        <li><span class="num">2</span><span id="s2"></span></li>
        <li><span class="num">3</span><span id="s3"></span></li>
      </ol>
      <p class="privacy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span id="privacy"></span></p>
    </div>
    <div class="card">
      <div class="drop" id="drop">
        <p style="font-weight:600;margin:0" id="dropTitle"></p>
        <p style="color:var(--muted);font-size:14px;margin:8px 0 0" id="dropHint"></p>
      </div>
      <input id="file" type="file" hidden accept=".pdf,.docx,.xlsx,.txt,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
      <div class="stack">
        <button class="btn" id="btnSample" type="button"></button>
        <button class="btn btn-sec" id="btnMovie" type="button"></button>
        <button class="btn btn-sec" id="btnBrowse" type="button"></button>
      </div>
      <details class="settings">
        <summary id="sumSettings"></summary>
        <div id="settingsMount"></div>
      </details>
      <p class="danger hidden" id="errLand"></p>
    </div>
  </div>
</section>

<section id="review" class="review hidden">
  <div class="toolbar" id="toolbar"></div>
  <p id="residual" class="ok"></p>
  <div class="work">
    <div class="pane">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
        <h2 class="lbl" style="margin:0" id="lblOrig"></h2>
        <button class="btn btn-sm btn-sec" id="btnAdd" type="button"></button>
      </div>
      <pre class="doc" id="orig"></pre>
    </div>
    <aside>
      <div class="filters" id="filters"></div>
      <div class="hits" id="hitList"></div>
      <div class="pane" id="inspector" style="margin-top:12px"></div>
      <div class="pane" style="margin-top:12px">
        <h2 class="lbl" id="lblRes"></h2>
        <pre class="doc" id="result" style="max-height:12rem"></pre>
      </div>
      <div class="pane" style="margin-top:12px">
        <h2 class="lbl" id="lblProc"></h2>
        <div class="process" id="processBox"></div>
      </div>
    </aside>
  </div>
</section>

<div class="bar hidden" id="bar"></div>
<footer id="footer"></footer>

<div class="modal hidden" id="helpModal">
  <div class="sheet" id="helpSheet"></div>
</div>
<div class="modal hidden" id="exportModal">
  <div class="sheet" id="exportSheet"></div>
</div>
<div class="modal hidden" id="settingsModal">
  <div class="sheet" id="settingsSheet" style="max-height:min(90dvh,720px);overflow:auto">
    <h2 id="settingsTitle" style="margin-top:0"></h2>
    <div id="settingsModalMount"></div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn" id="btnSettingsApply" type="button"></button>
      <button class="btn btn-sec" id="btnSettingsClose" type="button"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  function visibleHits(hits, sel){
    const ordered = [...hits].sort((a,b) => a.id===sel?-1:b.id===sel?1:a.start-b.start);
    const taken = []; const chosen = [];
    for (const h of ordered) {
      if (taken.some(([s,e]) => h.start < e && h.end > s)) continue;

  }

  function secretList(){ return S.secrets.split("\n").map(s=>s.trim()).filter(Boolean); }
  function runAnalyze(text, opts){
    const src = text ?? S.text;
    const prev = S.hits || [];
    const fresh = detect(src, S.enabled, secretList());
    const bySpan = new Map(prev.map(h => [h.type+"|"+h.start+"|"+h.end+"|"+h.value, h]));
    const byVal = new Map();
    prev.forEach(h => {
      const k = h.type+"|"+h.value.toLocaleLowerCase("cs");
      if (!byVal.has(k)) byVal.set(k, h);
    });
    S.hits = fresh.map(h => {
      const exact = bySpan.get(h.type+"|"+h.start+"|"+h.end+"|"+h.value);
      const loose = byVal.get(h.type+"|"+h.value.toLocaleLowerCase("cs"));
      if (exact) h.accept = exact.accept;
      else if (loose) h.accept = loose.accept;
      return h;
    });
    const sameSet = prev.length===S.hits.length && S.hits.every(h => bySpan.has(h.type+"|"+h.start+"|"+h.end+"|"+h.value));
    S.selectedId = S.hits.some(h => h.id===S.selectedId) ? S.selectedId : (S.hits[0] ? S.hits[0].id : null);
    if (!sameSet) S.seen = new Set(S.selectedId ? [S.selectedId] : []);

  function pageTextFromItems(items){

  function mapPageGlyphs(items, scale, vp){
    let text = "";
    const map = [];
    for (const it of items) {
      if (!it || !it.str) continue;
      if (text) text += " ";
      const start = text.length;
      text += it.str;
      const end = text.length;
      const tx = vp && pdfjsLib.Util.transform(vp.transform, it.transform);
      const h = tx ? Math.hypot(tx[2], tx[3]) : 0;
      map.push({
        start, end, str: it.str,
        x: tx ? tx[4] : 0,
        y: tx ? tx[5]-h : 0,
        w: (it.width||0)*scale,
        h: h*1.2

    }

  async function extractPdf(data){
    pdfWorker();
    const pdf = await pdfjsLib.getDocument({ data: data.slice(0), disableStream:true, disableAutoFetch:true }).promise;
    const pages = [];
    let text = "";
    for (let i=1;i<=pdf.numPages;i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      const compact = (tc.items||[]).map(it => ({ str: it.str, transform: it.transform, width: it.width }));
      const body = pageTextFromItems(compact);
      const chunk = "\n\n--- "+i+" ---\n"+body;
      const start = text.length + chunk.indexOf(body);
      text += chunk;
      pages.push({ n:i, start, end: start+body.length, body, items: compact });
    }
    return { text, pages };

  function translit(ch){
    const m = {"á":"a","č":"c","ď":"d","é":"e","ě":"e","í":"i","ň":"n","ó":"o","ř":"r","š":"s","ť":"t","ú":"u","ů":"u","ý":"y","ž":"z","Á":"A","Č":"C","Ď":"D","É":"E","Ě":"E","Í":"I","Ň":"N","Ó":"O","Ř":"R","Š":"S","Ť":"T","Ú":"U","Ů":"U","Ý":"Y","Ž":"Z","█":"#"};

  async function exportTextPdf(text, title){
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.create();
    stampPdfMeta(doc, title);
    const font = await doc.embedFont(StandardFonts.Helvetica);
    const pageW=595, pageH=842, margin=48, size=10, lh=13;
    const lines = [];
    for (const raw of text.split(/\n/)) {
      const safe = [...raw].map(translit).join("");
      let line="";
      for (const w of safe.split(/(\s+)/)) {
        if (font.widthOfTextAtSize(line+w, size) > pageW-margin*2) { lines.push(line); line = w.trimStart(); }
        else line += w;
      }
      lines.push(line);
    }
    let page = doc.addPage([pageW,pageH]); let y = pageH-margin;
    for (const line of lines) {
      if (y < margin) { page = doc.addPage([pageW,pageH]); y = pageH-margin; }
      page.drawText(line.slice(0,500), { x:margin, y, size, font, color: rgb(0.09,0.1,0.12) });

  async function exportPdfRaster(source, hits, title){
    pdfWorker();
    const pdf = await pdfjsLib.getDocument({ data: source.slice(0), disableStream:true, disableAutoFetch:true }).promise;
    const { PDFDocument } = PDFLib;
    const doc = await PDFDocument.create();
    stampPdfMeta(doc, title);
    for (let i=1;i<=pdf.numPages;i++) {
      const page = await pdf.getPage(i);
      const scale = 1.7; const vp = page.getViewport({ scale });
      const canvas = document.createElement("canvas"); canvas.width=vp.width; canvas.height=vp.height;
      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const pageMeta = (S.pages||[]).find(p => p.n===i);
      const rawItems = (pageMeta && pageMeta.items && pageMeta.items.length) ? pageMeta.items : (await page.getTextContent()).items;
      const mapped = mapPageGlyphs(rawItems, scale, vp);
      const text = mapped.text;
      const map = mapped.map;
      ctx.fillStyle = "#16181d";
      topHits(hits).filter(h => (h.page || pageOf(h.start)) === i).forEach(hit => {
        let idx = -1;
        if (pageMeta && hit.start >= pageMeta.start && hit.end <= pageMeta.end) {
          idx = hit.start - pageMeta.start;
          const slice = text.slice(idx, idx+hit.value.length);
          if (slice !== hit.value) {
            const local = text.indexOf(hit.value);
            idx = local;
          }
        }
        if (idx < 0) idx = text.indexOf(hit.value);
        if (idx < 0) {
          const compact = hit.value.replace(/\s+/g," ").trim();
          idx = text.indexOf(compact);
        }
        if (idx < 0) return;
        const end = idx + Math.max(hit.value.length, 1);
        map.forEach(m => { if (m.end>idx && m.start<end) ctx.fillRect(m.x-2, m.y-2, Math.max(m.w,6)+4, Math.max(m.h,8)+4); });
      });
      const blob = await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error("blob")), "image/jpeg", 0.84));
      const img = await doc.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      const p = doc.addPage([canvas.width*0.72, canvas.height*0.72]);
      p.drawImage(img, { x:0, y:0, width:p.getWidth(), height:p.getHeight() });
    }
    return await doc.save({ useObjectStreams:false });
  }

    const existingTrack = chip.querySelector(".chip-track");
    if (existingTrack) {

      if (original) chip.replaceChild(original, existingTrack);

    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    requestAnimationFrame(() => {
      const content = chip.querySelector(".chip-content");
      if (!content) return;

      if (reduce || contentWidth <= chipWidth + 2 || chipWidth < 24) return;
      const GAP = 32;
      const track = document.createElement("span");

      const clone = content.cloneNode(true);
      clone.classList.add("chip-content-clone");
      clone.setAttribute("aria-hidden", "true");
      chip.replaceChild(track, content);
      track.appendChild(content);
      track.appendChild(clone);
      const shift = contentWidth + GAP;
      chip.style.setProperty("--chip-marquee-shift", shift + "px");
      chip.style.setProperty("--chip-marquee-duration", marqueeDurationSec(shift) + "s");
      chip.classList.add("marquee");

        "Pro veřejnou AI nestačí schovat lidi. Ticket CBUAIS-5164, AIS SBS i stav produkce jsou také identifikátory.",
        "For a public AI, hiding people is not enough. Ticket CBUAIS-5164, AIS SBS and production status are identifiers too."
      ),
      action: () => {
        const h = S.hits.find(x => x.type === "ticket") || S.hits.find(x => x.type === "system");
        if (h) select(h.id);
      },
      highlight: "hitList",
      holdMs: 5800
    },
    {
      caption: () => movieCaption(
        "Režim „konzistentní token“ nahradí CBUAIS-5164 vždy stejným [TICKET_001]. Osnova a slovník používají stejná čísla.",
        "Consistent-token mode replaces CBUAIS-5164 with the same [TICKET_001] every time. The outline and glossary reuse those numbers."
      ),
      highlight: "result",
      holdMs: 5600
    },
    {
      chapter: () => movieCaption("Kapitola 5 — Kontrola a export", "Chapter 5 — Review and export"),
      caption: () => movieCaption(
        "Bez zaškrtnutí „Zkontrolováno“ export nejde. Druhá kontrola je pro čtyři oči.",
        "Export stays locked until you tick Reviewed. Second review is the four-eyes check."
      ),
      action: () => {
        S.reviewed = true;
        paintReview();
      },
      highlight: "bar",
      holdMs: 5200
    },
    {
      caption: () => movieCaption(
        "Export je nevratný: začerněné PDF, XLSX bez autora, nebo balíček pro AI s osnovou postupu a slovníkem bez původních hodnot.",
        "Export is irreversible: a rasterized PDF, metadata-stripped XLSX, or an AI pack with a process outline and a glossary without original values."
      ),
      highlight: "processBox",
      holdMs: 6000
    },
    {
      caption: () => movieCaption(
        "Teď si můžete vzor otevřít ručně, nebo nahrát vlastní dokument. Soubor zůstává v tomto zařízení.",
        "You can now open the sample yourself, or upload your own file. The document stays on this device."
      ),
      action: () => { exitMovieTutorial(true); },
      actionDelayMs: 900,
      holdMs: 2800
    }
  ];

  function movieClearPulse(){
    document.querySelectorAll(".movie-pulse").forEach(el => el.classList.remove("movie-pulse"));
  }
  function movieHighlight(id){
    movieClearPulse();
    if (!id) return;
    const el = $(id);
    if (el) {
      el.classList.add("movie-pulse");
      try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (_) {}
    }
  }
  function movieCancelPlayback(){
    if (MOVIE_TIMER) clearTimeout(MOVIE_TIMER);
    MOVIE_TIMER = null;
    MOVIE_PENDING = null;
  }
  function movieSetTimeout(fn, ms){
    MOVIE_PENDING = { fn, remainingMs: ms };
    scheduleMoviePending();
  }
  function scheduleMoviePending(){
    if (!MOVIE_PENDING) return;
    MOVIE_PENDING.startedAt = Date.now();
    MOVIE_TIMER = setTimeout(() => {
      const p = MOVIE_PENDING;
      MOVIE_PENDING = null;
      MOVIE_TIMER = null;
      if (p && p.fn) p.fn();
    }, Math.max(0, MOVIE_PENDING.remainingMs / movieEffectiveSpeed()));
  }
  function ensureMovieUI(){
    $("movie-caption-bar").classList.add("active");
    $("movie-controls").classList.add("active");
    document.body.classList.add("movie-active");
  }
  function hideMovieUI(){
    $("movie-caption-bar").classList.remove("active");
    $("movie-controls").classList.remove("active");
    $("movie-title-card").classList.remove("show");
    document.body.classList.remove("movie-active");
    document.body.classList.remove("movie-paused");
    movieClearPulse();
  }
  async function startMovieTutorial(){
    movieCancelPlayback();
    S.movie = true;
    S.movieStepIndex = 0;
    S.reviewed = false;
    MOVIE_PAUSED = false;
    document.body.classList.remove("movie-paused");
    MOVIE_SPEED = 1;
    MOVIE_SNAPSHOTS = [];
    $("movie-btn-speed").textContent = "1×";
    $("movie-btn-playpause").textContent = "⏸️";
    $("movie-btn-back").disabled = true;
    ensureMovieUI();
    await runMovieStep();
  }
  function movieShowCaption(step){
    const ch = typeof step.chapter === "function" ? step.chapter() : (step.chapter || "");
    const cap = typeof step.caption === "function" ? step.caption() : (step.caption || "");
    $("movie-chapter-label").textContent = ch;
    const inner = $("movie-caption-inner") || $("movie-caption-text");
    inner.textContent = cap;
    const wrap = $("movie-caption-text");
    if (wrap) {
      wrap.classList.add("action-marquee");
      requestAnimationFrame(() => initActionMarquees(wrap.parentElement || wrap));
    }
    if (ch) {
      $("movie-title-h").textContent = ch;
      $("movie-title-p").textContent = cap;
      $("movie-title-card").classList.add("show");
      movieSetTimeout(() => $("movie-title-card").classList.remove("show"), 2200);
    }
  }
  async function runMovieStep(){
    if (!S.movie) return;
    const idx = S.movieStepIndex || 0;
    const step = MOVIE_SCRIPT[idx];
    if (!step) { exitMovieTutorial(); return; }
    MOVIE_SNAPSHOTS[idx] = {
      text: S.text, hits: S.hits.map(h => Object.assign({}, h)),
      selectedId: S.selectedId, reviewed: S.reviewed, fileName: S.fileName
    };
    $("movie-btn-back").disabled = idx === 0;
    movieShowCaption(step);
    movieHighlight(step.highlight);
    const go = async () => {
      if (step.action) await step.action();
      movieHighlight(step.highlight);
      const hold = step.holdMs || 4000;
      movieSetTimeout(() => {
        if (!S.movie) return;
        S.movieStepIndex = idx + 1;
        runMovieStep();
      }, hold);
    };
    if (step.actionDelayMs) movieSetTimeout(go, step.actionDelayMs);
    else await go();
  }
  function movieTogglePause(){
    if (!S.movie) return;
    MOVIE_PAUSED = !MOVIE_PAUSED;
    document.body.classList.toggle("movie-paused", MOVIE_PAUSED);
    $("movie-btn-playpause").textContent = MOVIE_PAUSED ? "▶️" : "⏸️";
    if (MOVIE_PAUSED) {
      if (MOVIE_TIMER) clearTimeout(MOVIE_TIMER);
      MOVIE_TIMER = null;
      if (MOVIE_PENDING) {
        MOVIE_PENDING.remainingMs -= (Date.now() - MOVIE_PENDING.startedAt);
        if (MOVIE_PENDING.remainingMs < 0) MOVIE_PENDING.remainingMs = 0;
      }
    } else scheduleMoviePending();
  }
  function movieToggleSpeed(){
    MOVIE_SPEED = MOVIE_SPEED === 1 ? 1.75 : 1;
    $("movie-btn-speed").textContent = MOVIE_SPEED === 1 ? "1×" : "1,75×";
  }
  function movieSkipStep(){
    if (!S.movie) return;
    movieCancelPlayback();
    S.movieStepIndex = (S.movieStepIndex || 0) + 1;
    runMovieStep();
  }
  async function movieBackStep(){
    if (!S.movie) return;
    const idx = S.movieStepIndex || 0;
    if (idx <= 0) return;
    movieCancelPlayback();
    const prev = Math.max(0, idx - 1);
    const snap = MOVIE_SNAPSHOTS[prev];
    if (snap) {
      S.text = snap.text;
      S.hits = (snap.hits || []).map(h => Object.assign({}, h));
      S.selectedId = snap.selectedId;
      S.reviewed = snap.reviewed;
      S.fileName = snap.fileName;
      if (S.text) paint();
      else { reset(); S.movie = true; }
    }
    S.movieStepIndex = prev;
    await runMovieStep();
  }
  function exitMovieTutorial(keepDoc){
    movieCancelPlayback();
    S.movie = false;
    hideMovieUI();
    if (!keepDoc) reset();
    else paint();
  }

  function selfTest(){
    const enabled = Object.fromEntries(KEYS.map(k => [k, true]));
    const secrets = ["jednotkové ceny"];
    const prev = S.suspicion;
    const cases = [];
    cases.push({ name:"movie 70% slower", ok: Math.abs(movieEffectiveSpeed() - 0.3 * MOVIE_SPEED) < 1e-9 && MOVIE_SLOWDOWN === 0.3, type:"movie", includes:"0.3", got:[String(MOVIE_SLOWDOWN), String(movieEffectiveSpeed())] });
    cases.push({ name:"marquee helpers", ok: typeof initActionMarquees === "function" && typeof startTextMarquee === "function", type:"movie", includes:"fns", got:[typeof initActionMarquees, typeof startTextMarquee] });
    const expect = (name, text, sus, type, includes) => {
      S.suspicion = sus;
      const hits = detect(text, enabled, secrets);
      const ok = hits.some(h => h.type===type && String(h.value).includes(includes));
      cases.push({ name, ok, type, includes, got: hits.filter(h=>h.type===type).map(h=>h.value) });
    };
    const expectNone = (name, text, sus, type) => {
      S.suspicion = sus;
      const hits = detect(text, enabled, secrets);
      const bad = hits.filter(h => h.type===type);
      cases.push({ name, ok: bad.length===0, type, includes:"∅", got: bad.map(h=>h.value) });
    };
    expect("rc slash", "rodné číslo 780312/0006", "medium", "rc", "780312/0006");
    expect("ico label", "IČO: 00000205", "medium", "ico", "00000205");
    expect("namesti", "se sídlem Václavské náměstí 1, 110 00 Praha 1", "medium", "address", "náměstí");
    expect("ticket", "ticket CBUAIS-5164", "medium", "ticket", "CBUAIS-5164");
    expect("declined", "sešli jsme se s Novákem.", "medium", "name", "Novákem");
    expect("initials", "podepsal J. Novák", "medium", "name", "J. Novák");
    expect("ip", "server 10.12.8.4 uvnitř", "medium", "ip", "10.12.8.4");
    expect("host", "viz https://ais.internal/ticket/1", "medium", "host", "ais.internal");
    expect("geo", "stanoviště 50.087465, 14.421253", "medium", "geo", "50.087465");
    expect("el plate", "SPZ EL 1234", "medium", "spz", "EL 1234");
    expectNone("contract date", "V Praze dne 11. 9. 2026", "high", "dob");
    expectNone("iso ticket", "norma ISO-9001", "high", "ticket");
    expectNone("phone as rc high", "částka 777123456 bez rodného", "high", "rc");
    S.suspicion = "medium";
    const prevSys = S.systems, prevProj = S.projects;
    S.systems = "AIS SBS | SYSTÉM\neSpis | INTEGRACE\nSAMO2 | MODUL";
    S.projects = "CBUAIS | PROJEKT\nORION | PROJEKT";
    const sampleHits = detect(SAMPLE, enabled, secrets);
    const replaced = apply(SAMPLE, sampleHits, "pseudo", "cs");
    const gloss = buildGlossary(sampleHits, "pseudo", "cs", false);
    const byKey = new Map();
    sampleHits.filter(h=>h.accept && h.type==="name").forEach(h => {
      const list = byKey.get(h.entityKey)||[]; list.push(h.value); byKey.set(h.entityKey, list);
    });
    const janVals = [...byKey.values()].find(arr => arr.some(v => /Jan Novák/i.test(v))) || [];
    cases.push({ name:"name title shares key", ok: janVals.some(v => /Ing\.\s*Jan Novák/i.test(v)), type:"name", includes:"Ing. Jan Novák", got: janVals });
    const nameTok = new Map();
    const rNames = bindReplacer("pseudo", "cs", sampleHits);
    sampleHits.filter(h=>h.accept && h.type==="name").forEach(h => nameTok.set(h.value, rNames(h)));
    cases.push({ name:"name title same token", ok: nameTok.get("Jan Novák") && nameTok.get("Jan Novák")===nameTok.get("Ing. Jan Novák"), type:"name", includes:"same token", got: [...nameTok.entries()].map(([k,v])=>k+":"+v) });
    const extra = "Jan Novák volal Novákovi a sešel se s Novákem. J. Novák i Ing. Jan Novák.";
    const extraHits = detect(extra, enabled, []);
    const rExtra = bindReplacer("pseudo", "cs", extraHits);
    const extraToks = extraHits.filter(h=>h.type==="name").map(h => rExtra(h));
    cases.push({ name:"declined+initials share token", ok: extraToks.length>=4 && extraToks.every(t => t===extraToks[0]), type:"name", includes:"one person", got: extraHits.filter(h=>h.type==="name").map(h=>h.value+":"+h.entityKey+":"+rExtra(h)) });
    const sysText = "Projekt CBUAIS, systém AIS SBS, integrace eSpis, eSpis, modul SAMO2, AIS SBS.";
    const sysHits = detect(sysText, enabled, []);
    const rSys = bindReplacer("pseudo", "cs", sysHits);
    const espis = sysHits.filter(h => /espis/i.test(h.value) || /eSpis/.test(h.value));
    const espisTok = Array.from(new Set(espis.map(h => rSys(h))));
    cases.push({ name:"eSpis phrase+dict one token", ok: espis.length>=1 && espisTok.length===1, type:"system", includes:"eSpis", got: espis.map(h=>h.value+":"+h.entityKey+":"+rSys(h)) });
    const ais = sysHits.filter(h => /AIS SBS/i.test(h.value));
    const aisTok = Array.from(new Set(ais.map(h => rSys(h))));
    cases.push({ name:"AIS SBS phrase+dict one token", ok: ais.length>=1 && aisTok.length===1, type:"system", includes:"AIS SBS", got: ais.map(h=>h.value+":"+h.entityKey+":"+rSys(h)) });
    const icoDic = sampleHits.filter(h => h.type==="ico" || h.type==="dic");
    const firm = icoDic.filter(h => String(h.value).includes("25596641") || String(h.value).includes("CZ25596641"));
    const firmTok = Array.from(new Set(firm.map(h => rNames(h))));
    cases.push({ name:"ico+dic same org token", ok: firm.length>=2 && firmTok.length===1, type:"ico", includes:"25596641", got: firm.map(h=>h.value+":"+rNames(h)) });
    const applyTok = {};
    sampleHits.filter(h=>h.accept && h.type==="name").forEach(h => { applyTok[h.entityKey] = rNames(h); });
    const glossTok = {};
    gloss.filter(g => g.type==="name").forEach(g => { (glossTok[g.token] = glossTok[g.token]||[]).push(g); });
    const janToken = rNames(sampleHits.find(h => h.value==="Jan Novák"));
    const janGloss = gloss.filter(g => g.type==="name" && /Jan/.test(g.originalPreview||""));
    cases.push({ name:"glossary matches apply", ok: janGloss.length>=1 && janGloss.every(g => g.token===janToken), type:"name", includes:janToken, got: janGloss.map(g=>g.token+":"+g.originalPreview) });
    cases.push({ name:"status not mid-word", ok: !/odstraněny\)e/.test(replaced) && !/n\)epřipraven/.test(replaced), type:"status", includes:"word-boundary", got: [replaced.split("\n").filter(l=>/Stav|hotfix|nasazen|rollback|plánovan/i.test(l)).join(" | ")] });
    const t1 = sampleHits.find(h => h.value==="CBUAIS-5164");
    const t2hits = detect(SAMPLE + "\nOpakovaný ticket CBUAIS-5164.", enabled, secrets);
    const rT = bindReplacer("pseudo", "cs", t2hits);
    const same = t2hits.filter(h => h.value==="CBUAIS-5164").map(h => rT(h));
    cases.push({ name:"repeated ticket same token", ok: same.length>=2 && same.every(t => t===same[0]), type:"ticket", includes:"CBUAIS-5164", got: same });
    S.systems = prevSys; S.projects = prevProj;
    S.suspicion = prev;
    const failed = cases.filter(c => !c.ok);
    return { ok: failed.length===0, failed, n: cases.length };
  }

  if (typeof location !== "undefined" && /(?:\?|&)selftest=1\b/.test(location.search||"")) {
    const r = selfTest();
    console.log("Znečitelně selftest", r);
    if (!r.ok) console.warn(r.failed);
  }
  applyTheme();
  paint();
})();
</script>
</body>
