<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1f3348" />
<meta name="description" content="Lokální anonymizace dokumentů pro české státní firmy a přípravu textu pro veřejnou AI. Jeden HTML soubor. Žádný cloud." />
<meta property="og:title" content="Znečitelně" />
<meta property="og:description" content="Lokální anonymizace dokumentů pro české státní firmy a přípravu textu pro veřejnou AI. Jeden HTML soubor. Žádný cloud." />
<title>Znečitelně</title>
<style>
:root {
  --bg: #f3efe6; --bg-subtle: #e3dcc9; --surface: #fffcf6; --fg: #14161a;
  --muted: #464e57; --border: #b9ae94; --primary: #1a2c40; --on-primary: #ffffff;
  --accent: #2c4658; --danger: #7a1f1f; --ok: #1e5a3f; --hit: #a8460f; --add: #1f6b5c;
  --focus: #0f5fa8;
  --header-bg: #1a2c40; --header-fg: #ffffff; --header-muted: #d7e0e8;
  --overlay: rgba(14,16,20,.6); --bar-bg: color-mix(in srgb, var(--surface) 97%, transparent);
  --radius: 12px; --font: "Segoe UI", "Source Sans 3", system-ui, sans-serif;
  --display: Georgia, "Times New Roman", serif; --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #12161c; --bg-subtle: #1b222c; --surface: #1c2430; --fg: #e8e4d8;
  --muted: #9aa4b0; --border: #3a4656; --primary: #c9b896; --on-primary: #14161a;
  --accent: #8fb4c9; --danger: #e07a6a; --ok: #6fbf96; --hit: #e09a5a; --add: #6ec4b0;
  --focus: #7eb6e8;
  --header-bg: #0d1218; --header-fg: #e8e4d8; --header-muted: #9aa4b0;
  --overlay: rgba(6,8,12,.72); --bar-bg: color-mix(in srgb, var(--surface) 92%, transparent);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
button:not(:disabled) { cursor: pointer; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header.app :focus-visible { outline-color: #ffd166; }
h1, h2 { font-family: var(--display); font-weight: 600; }
header.app {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; padding: 12px 20px; background: var(--header-bg); color: var(--header-fg);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); color: var(--primary); display: grid; place-items: center; font-weight: 700; }
.tag { margin: 0; font-size: 12px; color: var(--header-muted); }
.hdr-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.feat-h { margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.feat-h:first-of-type { padding-top: 0; border-top: none; }
.feat-h4 { margin: 0 0 6px; font-size: 14px; }
.feat-list { margin: 0; padding-left: 18px; }
.feat-list li { margin: 3px 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid transparent;
  background: var(--primary); color: var(--on-primary); font-weight: 500; line-height: 1;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-pair .btn { width: 100%; min-height: 40px; }
.btn-eq { min-width: 140px; }
.btn-ghost {
  background: var(--surface); color: var(--fg);
  border-color: var(--border);
}
.btn-ghost:hover { background: var(--bg-subtle); border-color: var(--accent); }
header.app .btn-ghost {
  background: color-mix(in srgb, var(--header-fg) 10%, transparent);
  color: var(--header-fg);
  border-color: color-mix(in srgb, var(--header-fg) 48%, transparent);
}
header.app .btn-ghost:hover {
  background: color-mix(in srgb, var(--header-fg) 20%, transparent);
  border-color: color-mix(in srgb, var(--header-fg) 78%, transparent);
}
.btn-sec { background: var(--surface); color: var(--fg); border: 1.5px solid var(--border); }
.btn-sec:hover { background: var(--bg-subtle); border-color: var(--accent); }
.btn-file {
  background: var(--surface); color: var(--primary); border-color: var(--surface);
  font-weight: 650; box-shadow: 0 0 0 2px color-mix(in srgb, var(--header-fg) 28%, transparent);
}
.btn-file:hover { background: var(--bg); color: var(--fg); }
.btn-file .plus { font-size: 18px; line-height: 1; font-weight: 700; }
.btn-add-sel {
  background: var(--primary); color: var(--on-primary); border-color: var(--primary);
  font-weight: 700;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 38%, transparent);
}
.btn-add-sel:hover {
  background: color-mix(in srgb, var(--primary) 86%, black);
  border-color: color-mix(in srgb, var(--primary) 86%, black);
  color: var(--on-primary);
}
html[data-theme="dark"] .btn-add-sel:hover {
  background: color-mix(in srgb, var(--primary) 86%, white);
  border-color: color-mix(in srgb, var(--primary) 86%, white);
}
@media (max-width: 640px) {
  #lblNewFile { display: none; }
  header.app { gap: 8px; padding: 10px 12px; }
  .hdr-actions .btn-sm { min-height: 36px; min-width: 36px; padding: 0 10px; }
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; }
.grid-landing { display: grid; gap: 32px; }
@media (min-width: 900px) { .grid-landing { grid-template-columns: 1.1fr .9fr; align-items: start; } }
.lead { max-width: 36rem; color: var(--muted); }
ol.steps { padding: 0; margin: 28px 0; list-style: none; }
ol.steps li { display: flex; gap: 12px; margin: 12px 0; }
.num { width: 28px; height: 28px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 12px; flex: none; }
.card { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: 0 0 0 1.5px var(--border), 0 12px 40px rgba(20,22,26,.12); }
.drop {
  border: 2px dashed #8a806a; border-radius: 12px; background: var(--bg); padding: 40px 20px; text-align: center; cursor: pointer;
}
.drop.over { border-color: var(--accent); background: var(--bg-subtle); border-style: solid; }
.stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
details.settings { margin-top: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
label.field, .lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
select, input[type=text], textarea {
  width: 100%; min-height: 44px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg);
  padding: 8px 12px; font: inherit;
}
select:focus, input[type=text]:focus, textarea:focus { border-color: var(--focus); }
textarea { min-height: 80px; font-family: var(--mono); font-size: 13px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.cats label { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
.help-i {
  display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 99px;
  border: 1.5px solid var(--muted); font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface);
}
.privacy { display: flex; gap: 8px; color: var(--fg); font-size: 14px; margin-top: 28px; }
.review { max-width: 1400px; margin: 0 auto; padding: 8px 16px 120px; }
.queue { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
.queue .qchip-wrap { display:inline-flex; align-items:center; position:relative; }
.queue .qchip { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-top-right-radius:0; border-bottom-right-radius:0; border-right:none; }
.queue .qchip.active { border-color:var(--accent); background:var(--bg-subtle); font-weight:600; }
.queue .qchip-del { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:0 8px; border-radius:0 999px 999px 0; border:1.5px solid var(--border); border-left:1px solid color-mix(in srgb, var(--border) 50%, transparent); background:var(--surface); color:var(--muted); font-size:15px; font-weight:700; cursor:pointer; line-height:1; }
.queue .qchip-del:hover { background:var(--bg-subtle); color:var(--danger); border-color:var(--danger); }
.queue .qchip.active + .qchip-del { border-color:var(--accent); background:var(--bg-subtle); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; border: 1.5px solid var(--border); background: var(--bg-subtle); padding: 4px 10px; font-size: 12px; color: var(--fg); font-family: var(--mono); font-weight: 600; }
.ok { color: var(--ok); font-weight: 600; } .danger { color: var(--danger); font-weight: 600; }
.work { display: grid; gap: 16px; }
@media (min-width: 1100px) { .work { grid-template-columns: minmax(0,1fr) 340px; } }
.pane { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: 0 0 0 1.5px var(--border); }
pre.doc { max-height: min(70dvh, 640px); overflow: auto; white-space: pre-wrap; word-break: break-word; font: 13px/1.65 var(--mono); margin: 0; color: var(--fg); }
@media (min-width: 1100px) { #orig { max-height: min(85dvh, 980px); } }
body.pdf-visual-on #orig { display: none; }
#pdfVisual { max-height: min(70dvh, 640px); overflow: auto; background: var(--bg-subtle); border-radius: 8px; padding: 8px; }
@media (min-width: 1100px) { #pdfVisual { max-height: min(85dvh, 980px); } }
#pdfVisual.hidden { display: none; }
.pv-page { position: relative; margin: 0 auto 12px; box-shadow: 0 0 0 1.5px var(--border); background: #fff; }
.pv-page canvas { display: block; width: 100%; height: 100%; }
.pv-box { position: absolute; border: 1.5px solid; border-radius: 3px; padding: 0; cursor: pointer; }
.pv-box.pv-on { background: rgba(217,83,79,.28); border-color: #8a3a12; }
.pv-box.pv-off { background: rgba(46,140,96,.25); border-color: #1e5a3f; }
.pv-box.pv-prev { background: #16181a; border-color: #16181a; }
.pv-box.pv-sel { outline: 3px solid var(--focus); outline-offset: 1px; }
.pv-note { font-size: 12px; color: var(--muted); text-align: center; margin: 0 0 8px; }
button.btn-visual[disabled] { opacity: .5; }
.proc-summary { font-size: 13px; margin: 0 0 8px; }
.proc-details summary { cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 600; }
.proc-details[open] summary { margin-bottom: 8px; }
pre.doc button.mk { border: 1.5px solid transparent; border-radius: 3px; padding: 1px 3px; font: inherit; color: var(--fg); }
.mk-on { background: #f3c9a8; background: color-mix(in srgb, var(--hit) 45%, white); border-color: #8a3a12; border-color: color-mix(in srgb, var(--hit) 70%, black); font-weight: 600; }
.mk-off { background: #c5e4d4; background: color-mix(in srgb, var(--ok) 35%, white); border-color: #1e5a3f; border-color: color-mix(in srgb, var(--ok) 60%, black); }
.mk-sel { outline: 3px solid var(--focus); outline-offset: 1px; }
.mk-preview { background: color-mix(in srgb, var(--primary) 22%, white); border-color: color-mix(in srgb, var(--primary) 55%, black); font-weight: 600; }
html[data-theme="dark"] .mk-preview { background: color-mix(in srgb, var(--primary) 28%, var(--surface)); border-color: var(--primary); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); color: var(--fg); padding: 0 12px; font-size: 13px; font-weight: 500; }
.chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.hits { max-height: 42dvh; overflow: auto; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--border); }
.hit { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--fg); padding: 10px 12px; font: inherit; }
.hit.sel { background: var(--bg-subtle); box-shadow: inset 3px 0 0 var(--accent); }
.mono { font-family: var(--mono); font-size: 12px; }
.pill {
  flex: none; align-self: center; display: inline-grid; justify-items: center; align-items: center;
  border-radius: 999px; padding: 2px 8px; font-size: 10px; text-transform: uppercase;
  font-weight: 700; letter-spacing: .03em; text-align: center; line-height: 1.4;
}
.pill-label, .pill-ghost { grid-area: 1 / 1; white-space: nowrap; }
.pill-ghost { visibility: hidden; }
.pill-hit { background: var(--hit); color: #fff; }
.pill-ok { background: var(--ok); color: #fff; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--primary); color: var(--on-primary);
  padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 24px rgba(14,16,20,.18);
  max-height: min(42dvh, calc(100dvh - var(--hdr-h, 60px) - env(safe-area-inset-top, 0px)));
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.bar[data-pos="top"] {
  left: 0; right: 0; top: var(--hdr-h, 60px); bottom: auto;
  box-shadow: 0 6px 24px rgba(14,16,20,.18);
  padding-bottom: 10px;
  padding-top: 10px;
  max-height: min(42dvh, calc(100dvh - var(--hdr-h, 60px)));
}
.bar[data-pos="left"], .bar[data-pos="right"] {
  top: var(--hdr-h, 60px); bottom: 0; width: min(260px, 82vw);
  height: calc(100dvh - var(--hdr-h, 60px));
  max-height: none;
  overflow-y: auto;
}
.bar[data-pos="left"] { left: 0; right: auto; box-shadow: 6px 0 24px rgba(14,16,20,.18); }
.bar[data-pos="right"] { right: 0; left: auto; box-shadow: -6px 0 24px rgba(14,16,20,.18); }
.bar[data-pos="left"] .bar-inner, .bar[data-pos="right"] .bar-inner {
  flex-direction: column; align-items: stretch; max-width: none;
}
.bar[data-pos="left"] .bar-inner > *, .bar[data-pos="right"] .bar-inner > * { width: 100%; }
body.bar-pos-left .review, body.bar-pos-left .wrap { padding-left: min(276px, calc(82vw + 16px)); }
body.bar-pos-right .review, body.bar-pos-right .wrap { padding-right: min(276px, calc(82vw + 16px)); }
body.bar-pos-bottom .review { padding-bottom: calc(var(--bar-h, 120px) + 16px); }
body.bar-pos-top .review { padding-top: calc(var(--bar-h, 72px) + 4px); }
.bar-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar .check { color: var(--on-primary); }
.bar .btn {
  background: var(--surface); color: var(--fg);
  border-color: var(--surface);
  box-shadow: 0 1px 0 color-mix(in srgb, #000 18%, transparent);
}
.bar .btn:hover { background: var(--bg); border-color: var(--bg); }
.bar .btn-sec {
  background: color-mix(in srgb, var(--on-primary) 12%, transparent);
  color: var(--on-primary);
  border: 1.5px solid color-mix(in srgb, var(--on-primary) 55%, transparent);
  box-shadow: none;
}
.bar .btn-sec:hover {
  background: color-mix(in srgb, var(--on-primary) 22%, transparent);
  border-color: var(--on-primary);
}
.bar .btn-ghost {
  background: transparent; color: var(--on-primary);
  border-color: color-mix(in srgb, var(--on-primary) 50%, transparent);
  box-shadow: none;
}
.bar .btn-ghost:hover {
  background: color-mix(in srgb, var(--on-primary) 16%, transparent);
  border-color: var(--on-primary);
}
.bar .btn:disabled {
  opacity: .5;
  background: color-mix(in srgb, var(--on-primary) 10%, transparent);
  color: var(--on-primary);
  border-color: color-mix(in srgb, var(--on-primary) 28%, transparent);
  box-shadow: none;
}
.view-switch {
  display: inline-flex; align-items: stretch; flex: 0 1 auto;
  border-radius: 999px; overflow: hidden;
  border: 1.5px solid color-mix(in srgb, var(--on-primary) 55%, transparent);
  background: color-mix(in srgb, var(--on-primary) 10%, transparent);
}
.view-switch .btn {
  min-height: 36px; padding: 0 12px; font-size: 12px; font-weight: 650;
  border-radius: 0; border: 0; box-shadow: none;
  background: transparent; color: var(--on-primary);
}
.view-switch .btn + .btn { border-left: 1px solid color-mix(in srgb, var(--on-primary) 35%, transparent); }
.view-switch .btn:hover { background: color-mix(in srgb, var(--on-primary) 18%, transparent); }
.view-switch .btn.on {
  background: var(--surface); color: var(--fg);
}
.view-switch .btn.on:hover { background: var(--bg); }
.bar #btnExp, .bar #btnAi { min-height: 44px; padding: 0 20px; font-weight: 700; }
.bar #btnAudit {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; min-width: 140px; padding: 0 16px;
  font-size: 14px; font-weight: 500; line-height: 1;
  border-radius: 999px;
}
@media (max-width: 720px) {
  .bar #btnAudit { min-height: 40px; min-width: 0; padding: 0 12px; font-size: 13px; }
}
.bar #btnExp {
  background: var(--surface); color: var(--fg);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--on-primary) 28%, transparent);
}
.bar #btnExp:hover { background: var(--bg); }
.bar #btnAi {
  background: color-mix(in srgb, var(--on-primary) 14%, transparent);
  color: var(--on-primary);
  border: 1.5px solid color-mix(in srgb, var(--on-primary) 62%, transparent);
  box-shadow: none;
}
.bar #btnAi:hover {
  background: color-mix(in srgb, var(--on-primary) 24%, transparent);
  border-color: var(--on-primary);
}
.toolbar .btn-ghost {
  background: var(--surface); color: var(--fg); border-color: var(--border);
}
.toolbar .btn-ghost:hover { background: var(--bg-subtle); border-color: var(--accent); }
@media (max-width: 720px) {
  .bar { padding-left: 10px; padding-right: 10px; }
  .bar-inner { gap: 6px; }
  .bar .btn, .bar .btn-sm { min-height: 40px; padding: 0 12px; font-size: 13px; }
  .bar #btnExp, .bar #btnAi { min-height: 40px; padding: 0 14px; flex: 1 1 auto; }
  .bar .btn-eq { min-width: 0; }
  .bar .check { min-height: 40px; padding: 0 4px; font-size: 13px; }
}
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px; font-size: 14px; }
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--overlay); padding: 16px; }
.sheet { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 12px 40px rgba(14,16,20,.3); }
.hidden { display: none !important; }
footer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 16px 24px; }
kbd { display: inline-block; min-width: 1.4rem; padding: .1rem .4rem; border-radius: 4px; border: 1.5px solid var(--muted); background: var(--surface); color: var(--fg); font: 11px/1.4 var(--mono); font-weight: 700; text-align: center; }
#tip {
  position: fixed; z-index: 80; max-width: 280px; padding: 8px 12px; border-radius: 8px;
  background: var(--primary); color: var(--on-primary); font-size: 12px; line-height: 1.4;
  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s;
  box-shadow: 0 8px 24px rgba(31,51,72,.18);
}
#tip.on { opacity: 1; transform: none; }
.toast {
  position: fixed; right: 16px; bottom: calc(var(--bar-h, 80px) + 12px); z-index: 50; background: var(--primary); color: var(--on-primary);
  padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none;
}
.process { font-size: 13px; line-height: 1.45; max-height: 22rem; overflow: auto; }
.process h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; font-family: var(--font); }
.process ul { margin: 0; padding-left: 1.1rem; }
.process .token { font-family: var(--mono); font-size: 12px; }
.leak-ok { color: var(--ok); }
.leak-bad { color: var(--danger); }
.layer-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.dict-hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

/* Quick mode: hide secondary UI, keep only the essentials to finish a redaction pass */
body.quick-mode #landingSteps,
body.quick-mode #landingSettingsDetails,
body.quick-mode .toolbar,
body.quick-mode #filters,
body.quick-mode #hitList,
body.quick-mode #resultPane,
body.quick-mode #processPane,
body.quick-mode .bar #chk2,
body.quick-mode .bar label:has(#chk2),
body.quick-mode .bar #btnAll,
body.quick-mode .bar #btnNone,
body.quick-mode .bar #btnOff,
body.quick-mode .bar #btnAudit,
body.fast-approve .bar #chk2,
body.fast-approve .bar label:has(#chk2),
body.fast-approve .bar #chkRev,
body.fast-approve .bar label:has(#chkRev) {

#quickHitBar { padding: 12px; }
#quickHitBar .qh-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: stretch; gap: 10px;
}
#quickHitBar .qh-val {
  display: block; width: 100%; min-width: 0;
  font-family: var(--mono); font-size: 13px; line-height: 1.45;
  overflow-wrap: anywhere; word-break: break-word; white-space: normal;
}
#quickHitBar .qh-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--header-muted); display: block; margin-bottom: 2px;
  font-family: var(--font);
}
#quickHitBar .qh-actions {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
#quickHitBar .qh-navs { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
#quickHitBar .qh-nav {
  min-width: 36px; min-height: 36px; padding: 0 12px;
  font-size: 13px; line-height: 1;
  background: var(--surface); color: var(--fg);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--on-primary) 32%, transparent);
}
#quickHitBar .qh-nav .qh-arrow {
  display: block;
  font-size: 140%;
  font-weight: 900;
  line-height: 1;
}
#quickHitBar .qh-nav:hover { background: var(--bg); border-color: var(--bg); }
/* Quick-mode hit card floats above the (still visible) export bar rather than replacing it */
body.quick-mode.hit-selected #quickHitBar[data-pos="bottom"] { bottom: calc(var(--export-bar-h, 60px) + 8px); }
body.quick-mode.hit-selected #quickHitBar[data-pos="top"] { top: calc(var(--hdr-h, 60px) + var(--export-bar-h, 60px) + 8px); }
/* When the export bar is a side panel (left/right), the hit card still docks to the bottom of the screen so it never overlaps it */
body.quick-mode #quickHitBar[data-pos="left"],
body.quick-mode #quickHitBar[data-pos="right"] {
  left: 0; right: 0; top: auto; bottom: 0; width: auto; height: auto; max-height: none;
}

  function digits(s){ return String(s).replace(/[^\d]/g, ""); }
  function parseRC(raw){
    const m = String(raw).trim().match(/^(\d{2})(\d{2})(\d{2})\s*\/?\s*(\d{3,4})$/);
    if (!m) return null;
    let month = +m[2];
    if (month >= 71) month -= 70; else if (month >= 51) month -= 50; else if (month >= 21) month -= 20;
    const day = +m[3];
    if (month < 1 || month > 12 || day < 1 || day > 31) return null;
    const yy = +m[1];
    const d = m[1]+m[2]+m[3]+m[4];
    if (d.length === 10 && Number(d) % 11 !== 0) return null;
    if (d.length !== 9 && d.length !== 10) return null;
    const year = d.length === 9 ? 1900 + yy : (yy < 54 ? 2000 + yy : 1900 + yy);
    const dim = [31, (year%4===0&&year%100!==0)||year%400===0?29:28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month-1];
    if (day > dim) return null;
    return true;
  }

    return new Uint8Array(buf);
  }

    const w = [8,7,6,5,4,3,2]; let sum = 0;
    for (let i=0;i<7;i++) sum += w[i]*+d[i];
    return (11 - (sum % 11)) % 10 === +d[7];

    const s = String(raw).replace(/\s+/g,"").toUpperCase();

  function ibanOk(iban){
    const s = iban.replace(/\s+/g,"").toUpperCase();
    if (!/^CZ\d{22}$/.test(s)) return false;
    const rearr = s.slice(4)+s.slice(0,4);
    let rem = 0;
    for (const ch of rearr) {
      const v = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0)-55) : ch;
      for (const d of v) rem = (rem * 10 + +d) % 97;
    }
    return rem === 1;
  }

  function generalizeLine(line, hits, lineStart, replacer){

  function pdfVisualAvailable(){ return S.kind === "pdf" && !!S.sourceBuf && !!window.pdfjsLib; }
  function pdfWordQuads(glyphs){
    if (!glyphs || !glyphs.length) return [];
    const lines = [];
    const sorted = glyphs.slice().sort((a,b) => a.y - b.y || a.x - b.x);
    for (const g of sorted) {
      const line = lines.find(l => Math.abs(l.y - g.y) < Math.max(g.h, l.h) * 0.45);
      if (line) {
        line.minX = Math.min(line.minX, g.x);
        line.maxX = Math.max(line.maxX, g.x + g.w);
        line.minY = Math.min(line.minY, g.y);
        line.maxY = Math.max(line.maxY, g.y + g.h);
        line.h = Math.max(line.h, g.h);
      } else {
        lines.push({ y: g.y, h: g.h, minX: g.x, maxX: g.x + g.w, minY: g.y, maxY: g.y + g.h });
      }
    }
    return lines.map(l => {
      const fullH = Math.max(l.maxY - l.minY, l.h, 6);
      // Mírně zúžit svisle: inset ~10 % výšky fontu (min 1px, max 2.5px), aby se box nedotkl sousedních řádků
      const vInset = Math.max(1, Math.min(2.5, fullH * 0.1));
      return {
        x: l.minX,
        y: l.minY + vInset,
        w: Math.max(l.maxX - l.minX, 4),
        h: Math.max(fullH - (vInset * 2), 4)
      };
    });
  }

  function paintPdfVisualOverlays(){
    if (!PV) return;
    const previewOn = S.docView === "preview";
    PV.pages.forEach(pg => {
      pg.layer.innerHTML = "";
      S.hits.forEach(h => {
        const meta = (S.pages || []).find(p => p.n === pg.n);
        if (!meta || h.start < meta.start || h.start >= meta.end + 1) return;
        const rel = h.start - meta.start;
        let idx = pg.text.slice(rel, rel + h.value.length) === h.value ? rel : pg.text.indexOf(h.value);
        if (idx < 0) return;
        const end = idx + Math.max(h.value.length, 1);
        const glyphs = pg.map.filter(m => m.end > idx && m.start < end);
        if (!glyphs.length) return;
        pdfWordQuads(glyphs).forEach(r => {
          const b = document.createElement("button");
          b.type = "button";
          b.dataset.id = h.id;
          b.className = "pv-box " + (h.accept ? (previewOn ? "pv-prev" : "pv-on") : "pv-off") + (S.selectedId === h.id ? " pv-sel" : "");

  async function buildPdfVisual(token){

    const pdf = await getPdfDocument(S.sourceBuf);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pages = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      if (token !== pvToken) return;
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const scale = width / base.width;
      const vp = page.getViewport({ scale });
      const vpHi = page.getViewport({ scale: scale * dpr });
      const wrap = document.createElement("div");
      wrap.className = "pv-page";
      wrap.style.width = vp.width + "px"; wrap.style.height = vp.height + "px";
      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(vpHi.width); canvas.height = Math.floor(vpHi.height);

      const layer = document.createElement("div");
      layer.style.cssText = "position:absolute;inset:0";

      const raw = (meta && meta.items && meta.items.length) ? meta.items : (await page.getTextContent()).items;

  function runAnalyze(text, opts){

    const contextBefore = S.analysisContext || "";

    const canReusePrevious = contextBefore === contextNow && contextBefore !== "";

    previousForReuse.forEach(h => {

    });

      const exact = bySpan.get(h.type+"|"+h.start+"|"+h.end+"|"+h.value);
      const loose = byVal.get(h.type+"|"+h.value.toLocaleLowerCase("cs"));

      if (exact) h.accept = exact.accept;
      else if (loose) h.accept = loose.accept;

      const prevHit = exact || loose;
      if (prevHit) {
        if (prevHit.legalBasis) h.legalBasis = prevHit.legalBasis;
        if (prevHit.legalCustom) h.legalCustom = prevHit.legalCustom;

      ? S.selectedId

    if (!sameSet) {

      S.secondEyes = false;

  function localizeIngestError(err, fallbackFileName = "") {
    if (!err) return "";
    const code = err.code || err.message;
    const f = err.fileName || fallbackFileName || "";
    const dict = (typeof i === "function") ? i() : {};
    if (code === IngestErrorCode.EMPTY_DOCUMENT || code === "errFileEmpty") {
      return (dict.errFileEmpty || "Soubor {f} je prázdný.").replace("{f}", f);
    }
    if (code === IngestErrorCode.FILE_TOO_LARGE || code === "errFileTooLarge") {
      return (dict.errFileTooLarge || "Soubor {f} je příliš velký (limit 100 MB).").replace("{f}", f);
    }
    if (code === IngestErrorCode.UNSUPPORTED_BINARY || code === "errFileBinary") {
      return (dict.errFileBinary || "Soubor {f} obsahuje neznámá binární data.").replace("{f}", f);
    }
    if (code === IngestErrorCode.LEGACY_DOC_FORMAT || code === "errDocOld") {

  async function buildCanonicalDocument({ fileName, kind, text, sourceBuf = null, pages = null, cellMap = null, sigDetected = false }){
    const cleanText = String(text || "").normalize("NFC");
    const docPages = (pages && pages.length)
      ? pages
      : (cleanText ? [{ n: 1, start: 0, end: cleanText.length, body: cleanText, items: [], noTextLayer: false }] : []);

      id: "doc_" + Math.random().toString(36).slice(2, 10),
      fileName: fileName || "document",
      kind: kind || "text",
      text: cleanText,
      sourceBuf: (kind === "pdf" || kind === "xlsx" || kind === "docx") ? sourceBuf : null,
      pages: docPages,
      noTextPages: docPages.filter(p => p.noTextLayer).length,
      cellMap: cellMap || [],

      hashIn: hashIn

  function decodeTextBuffer(buf){
    const u8 = toBytes(buf);
    if (!u8 || !u8.length) return "";
    if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) {
      return new TextDecoder("utf-8").decode(u8.subarray(3));
    }
    if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) {
      return new TextDecoder("utf-16le").decode(u8.subarray(2));
    }
    if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) {
      return new TextDecoder("utf-16be").decode(u8.subarray(2));
    }
    if (u8.length >= 4) {
      const checkLen = Math.min(u8.length - (u8.length % 2), 256);
      let zeroOdds = 0;
      for (let i = 1; i < checkLen; i += 2) {
        if (u8[i] === 0) zeroOdds++;
      }
      if (zeroOdds / (checkLen / 2) > 0.8) {
        try {
          return new TextDecoder("utf-16le").decode(u8);
        } catch (_) {}
      }
    }
    try {
      return new TextDecoder("utf-8", { fatal: true }).decode(u8);
    } catch (_) {}
    try {
      return new TextDecoder("windows-1250").decode(u8);
    } catch (_) {}
    try {
      return new TextDecoder("iso-8859-2").decode(u8);
    } catch (_) {
      return new TextDecoder("latin1").decode(u8);
    }
  }

  function isBinaryBuffer(buf){
    const u8 = toBytes(buf);
    if (!u8 || !u8.length) return false;
    if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return false;
    if (u8.length >= 2 && ((u8[0] === 0xFF && u8[1] === 0xFE) || (u8[0] === 0xFE && u8[1] === 0xFF))) return false;
    if (u8.length >= 4) {
      const checkLen = Math.min(u8.length - (u8.length % 2), 256);
      let zeroOdds = 0;
      for (let i = 1; i < checkLen; i += 2) {
        if (u8[i] === 0) zeroOdds++;
      }
      if (zeroOdds / (checkLen / 2) > 0.8) return false;
    }
    const limit = Math.min(u8.length, 8000);
    let ctrl = 0;
    for (let i = 0; i < limit; i++) {
      const b = u8[i];
      if (b === 0) return true;
      if (b < 9 || (b > 13 && b < 32 && b !== 27)) ctrl++;
    }
    return (ctrl / limit) > 0.05;
  }

  function extractRtfText(rtfStr){
    let raw = String(rtfStr || "");
    let s = "";
    let i = 0;
    while (i < raw.length) {
      if (raw[i] === "{" && raw[i + 1] === "\\") {
        const rest = raw.slice(i + 2);
        if (/^(\*|(?:fonttbl|colortbl|stylesheet|info|pict)\b)/i.test(rest)) {
          let depth = 1;
          i += 2;
          while (i < raw.length && depth > 0) {
            if (raw[i] === "\\") { i += 2; continue; }
            if (raw[i] === "{") depth++;
            else if (raw[i] === "}") depth--;
            i++;
          }
          continue;
        }
      }
      s += raw[i];
      i++;
    }
    s = s.replace(/\\bullet\b ?/gi, "•")
         .replace(/\\endash\b ?/gi, "–")
         .replace(/\\emdash\b ?/gi, "—")
         .replace(/\\ldblquote\b ?/gi, "„")
         .replace(/\\rdblquote\b ?/gi, "“")
         .replace(/\\lquote\b ?/gi, "‘")
         .replace(/\\rquote\b ?/gi, "’")
         .replace(/\\~/g, "\u00A0")
         .replace(/\\_/g, "\u2011");
    s = s.replace(/\\par\b ?/gi, "\n").replace(/\\line\b ?/gi, "\n").replace(/\\tab\b ?/gi, "\t");
    s = s.replace(/\\u(-?\d+)[^\\{}]?/g, (_, c) => {
      let n = parseInt(c, 10);
      if (n < 0) n += 65536;
      return String.fromCharCode(n);
    });
    s = s.replace(/(?:\\'([0-9a-fA-F]{2}))+/g, m => {
      const b = [];
      const re = /\\'([0-9a-fA-F]{2})/g;
      let x;
      while ((x = re.exec(m)) !== null) b.push(parseInt(x[1], 16));
      try {
        return new TextDecoder("windows-1250").decode(new Uint8Array(b));
      } catch (_) {
        return m;
      }
    });
    s = s.replace(/\\\\/g, "\uE000").replace(/\\\{/g, "\uE001").replace(/\\\}/g, "\uE002");
    s = s.replace(/\\([\\{}~])/g, "$1");
    s = s.replace(/\\([a-zA-Z]+)-?\d* ?/g, "");
    s = s.replace(/[{}]/g, "");
    s = s.replace(/\\/g, "");
    s = s.replace(/\uE001/g, "{").replace(/\uE002/g, "}").replace(/\uE000/g, "\\");
    return s.replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();
  }

  function extractOdtText(buf){
    if (!window.fflate) throw new Error("fflate není k dispozici");
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const files = fflate.unzipSync(u8);

    return elements.map(el => {
      const parts = Array.from(el.childNodes).map(n => {
        if (n.nodeType === 3) return n.nodeValue || "";
        const name = n.localName;
        if (name === "tab") return "\t";
        if (name === "line-break") return "\n";
        if (name === "s") {
          const count = parseInt(n.getAttributeNS("*", "c") || n.getAttribute("text:c") || "1", 10);
          return " ".repeat(Math.max(1, count));
        }
        return n.textContent || "";
      });
      return parts.join("").trim();
    }).filter(Boolean).join("\n\n");
  }

  function extractDocxTextWithFflate(buf){
    if (!window.fflate) throw new Error("fflate není k dispozici");
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const files = fflate.unzipSync(u8);
    const docKey = Object.keys(files).find(k => k.replace(/\\/g, "/").toLowerCase() === "word/document.xml");
    const docEntry = docKey ? files[docKey] : null;
    if (!docEntry) throw new Error("Neplatný DOCX: chybí word/document.xml");

    function parseDocxXml(entryBytes){
      if (!entryBytes) return "";
      const xml = new TextDecoder("utf-8").decode(entryBytes);
      const doc = new DOMParser().parseFromString(xml, "application/xml");
      if (doc.getElementsByTagName("parsererror").length) return "";
      const paras = Array.from(doc.getElementsByTagNameNS(DOCX_W_NS, "p"));
      return paras.map(p => {
        const texts = Array.from(p.getElementsByTagNameNS(DOCX_W_NS, "*")).filter(n => {
          const name = n.localName;
          return name === "t" || name === "tab" || name === "noBreakHyphen" || name === "softHyphen" || name === "br";
        }).map(n => {
          const name = n.localName;
          if (name === "t") return n.textContent || "";
          if (name === "tab") return "\t";
          if (name === "noBreakHyphen") return "\u2011";
          if (name === "softHyphen") return "\u00AD";
          if (name === "br") return "\n";
          return "";
        });
        return texts.join("");
      }).join("\n");
    }

    const sections = [];
    Object.keys(files).filter(k => /^word\/header\d*\.xml$/i.test(k.replace(/\\/g, "/"))).sort().forEach(k => {
      const t = parseDocxXml(files[k]).trim();
      if (t) sections.push(t);
    });
    const body = parseDocxXml(docEntry);
    if (body) sections.push(body);
    Object.keys(files).filter(k => /^word\/(footnotes|endnotes|footer\d*)\.xml$/i.test(k.replace(/\\/g, "/"))).sort().forEach(k => {
      const t = parseDocxXml(files[k]).trim();
      if (t) sections.push(t);
    });

    return sections.join("\n\n");
  }

  function isImageFile(name, type){
    const n = (name || "").toLowerCase();
    return /\.(png|jpe?g|webp|bmp|gif|tiff?)$/i.test(n) || (typeof type === "string" && type.startsWith("image/"));
  }

  async function handleImageFile(file, buf, options = {}){
    const ocrEnabled = options.ocrEnabled ?? S.ocrEnabled;
    if (!ocrEnabled || !window.Tesseract) {
      throw new DocumentIngestionError(IngestErrorCode.IMAGE_NEED_OCR, file ? file.name : "");
    }
    const reportProgress = options.onProgress || showOcrProgress;
    const t = options.lang || S.lang;
    reportProgress(t === "cs" ? "OCR: připravuji obrázek…" : "OCR: preparing image…");

    const imgBlob = new Blob([buf], { type: (file && file.type) || "image/png" });
    const imgUrl = URL.createObjectURL(imgBlob);
    let img;
    try {
      img = await new Promise((resolve, reject) => {
        const el = new Image();
        el.onload = () => resolve(el);
        el.onerror = () => reject(new Error("Nelze načíst obrázek"));
        el.src = imgUrl;
      });
    } finally {
      URL.revokeObjectURL(imgUrl);
    }

    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth || img.width;
    canvas.height = img.naturalHeight || img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);

    let ocrWorker = null;
    let text = "";
    let items = [];
    try {
      reportProgress(t === "cs" ? "OCR: spouštím rozpoznávání textu…" : "OCR: running recognition…");
      ocrWorker = await Tesseract.createWorker("ces", 1, {
        ...((window.__libLocal && window.__libLocal.tesseract) ? { workerPath:"./lib/tesseract/worker.min.js", corePath:"./lib/tesseract/core/", langPath:"./lib/tesseract/lang/" } : {}),
        logger: m => {
          if (m.status === "recognizing text") {
            reportProgress((t === "cs" ? "OCR: rozpoznávám text" : "OCR: recognizing text") +
              " (" + Math.round((m.progress || 0) * 100) + "%)…");
          }
        }
      });
      const { data: ocrData } = await ocrWorker.recognize(canvas);
      items = (ocrData.words || []).filter(w => w.text && w.text.trim() && (w.confidence || 0) > 20).map(w => ({
        str: w.text,
        _ocr: true,
        _pdfX: w.bbox.x0,
        _pdfYTop: w.bbox.y0,
        _pdfW: w.bbox.x1 - w.bbox.x0,
        _pdfH: w.bbox.y1 - w.bbox.y0,
        transform: null,
        width: w.bbox.x1 - w.bbox.x0
      }));
      text = items.map(w => w.str).join(" ");
    } catch (e) {
      console.warn("OCR on image failed:", e);
      throw new Error("OCR: " + (e.message || String(e)));
    } finally {
      if (ocrWorker) await ocrWorker.terminate();
      hideOcrProgress();
    }

    let pdfBuf = null;
    if (window.PDFLib) {
      try {
        const { PDFDocument } = PDFLib;
        const doc = await PDFDocument.create();
        let pdfImg = null;
        if ((file && file.type === "image/png") || (file && /\.png$/i.test(file.name))) {
          try {
            pdfImg = await doc.embedPng(new Uint8Array(buf));
          } catch (_) {}
        }
        if (!pdfImg) {
          try {
            pdfImg = await doc.embedJpg(new Uint8Array(buf));
          } catch (_) {}
        }
        if (!pdfImg) {
          const jpgBlob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.92));
          if (jpgBlob) {
            const jpgBytes = new Uint8Array(await jpgBlob.arrayBuffer());
            pdfImg = await doc.embedJpg(jpgBytes);
          }
        }
        if (pdfImg) {
          const p = doc.addPage([canvas.width, canvas.height]);
          p.drawImage(pdfImg, { x: 0, y: 0, width: canvas.width, height: canvas.height });
          pdfBuf = await doc.save();
        }
      } catch (err) {
        console.warn("PDFLib image wrap skipped:", err);
      }
    }

    const docName = (file && file.name) || "image";
    if (pdfBuf) {
      return await buildCanonicalDocument({
        fileName: docName,
        kind: "pdf",
        text,
        sourceBuf: pdfBuf,
        pages: [{ n: 1, start: 0, end: text.length, body: text, items, noTextLayer: false }]
      });
    } else {
      return await buildCanonicalDocument({
        fileName: docName,
        kind: "text",
        text,
        sourceBuf: buf
      });
    }
  }

  async function ingestDocument(input, options = {}){
    const file = input;
    const name = (file && file.name) || options.fileName || "document";
    const size = typeof file?.size === "number" ? file.size : (file?.buffer?.byteLength || 0);

    if (!file || (size === 0 && !file.arrayBuffer && !file.buffer)) {
      throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
    }
    if (size > 100 * 1024 * 1024) {
      throw new DocumentIngestionError(IngestErrorCode.FILE_TOO_LARGE, name);
    }

    const buf = file.arrayBuffer ? await file.arrayBuffer() : (file.buffer ? file.buffer : toBytes(file).buffer);
    if (!buf || buf.byteLength === 0) {
      throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
    }
    if (buf.byteLength > 100 * 1024 * 1024) {
      throw new DocumentIngestionError(IngestErrorCode.FILE_TOO_LARGE, name);
    }

    const n = name.toLowerCase();
    const type = (file && file.type) || options.type || "";
    const u8Magic = new Uint8Array(buf.slice(0, 8));
    const isZip = u8Magic.length >= 4 && u8Magic[0] === 0x50 && u8Magic[1] === 0x4B && u8Magic[2] === 0x03 && u8Magic[3] === 0x04;
    const isPdfMagic = u8Magic.length >= 5 && u8Magic[0] === 0x25 && u8Magic[1] === 0x50 && u8Magic[2] === 0x44 && u8Magic[3] === 0x46 && u8Magic[4] === 0x2D;
    const isRtfMagic = u8Magic.length >= 5 && u8Magic[0] === 0x7B && u8Magic[1] === 0x5C && u8Magic[2] === 0x72 && u8Magic[3] === 0x74 && u8Magic[4] === 0x66;

    if (n.endsWith(".doc")) {
      throw new DocumentIngestionError(IngestErrorCode.LEGACY_DOC_FORMAT, name);
    } else if (n.endsWith(".docx") || type === "application/vnd.openxmlformats-officedocument.wordprocessingml.document") {
      let text = "";
      let mammothErr = null;
      if (window.mammoth) {
        try {
          const res = await window.mammoth.extractRawText({ arrayBuffer: buf });
          text = (res && res.value) || "";
        } catch (e) {
          mammothErr = e;
        }
      }
      if (!text && window.fflate) {
        try {
          text = extractDocxTextWithFflate(buf);
        } catch (e) {
          if (mammothErr) throw mammothErr;
          throw e;
        }
      } else if (!text && mammothErr) {
        throw mammothErr;
      }
      if (!text || !text.trim()) {
        throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
      }
      return await buildCanonicalDocument({ fileName: name, kind: "docx", text, sourceBuf: buf });
    } else if (n.endsWith(".xlsx") || n.endsWith(".xls") || n.endsWith(".ods") || type === "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" || type === "application/vnd.ms-excel" || type === "application/vnd.oasis.opendocument.spreadsheet") {
      const extracted = await extractXlsx(buf);
      if (!extracted || !extracted.text || !extracted.text.trim()) {
        throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
      }
      return await buildCanonicalDocument({ fileName: name, kind: "xlsx", text: extracted.text, sourceBuf: buf, cellMap: extracted.cellMap });
    } else if (n.endsWith(".odt") || type === "application/vnd.oasis.opendocument.text") {
      const text = extractOdtText(buf);
      if (!text || !text.trim()) {
        throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
      }
      return await buildCanonicalDocument({ fileName: name, kind: "text", text, sourceBuf: buf });
    } else if (n.endsWith(".rtf") || type === "application/rtf" || type === "text/rtf" || isRtfMagic) {
      const raw = decodeTextBuffer(buf);
      const text = extractRtfText(raw);
      if (!text || !text.trim()) {
        throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
      }
      return await buildCanonicalDocument({ fileName: name, kind: "text", text, sourceBuf: buf });
    } else if (n.endsWith(".pdf") || type === "application/pdf" || isPdfMagic) {
      const extracted = await extractPdf(buf);
      const sigDetected = (extracted.pages && extracted.pages.some(p => p.signatures && p.signatures.length)) || pdfHasSignatureBytes(buf);
      return await buildCanonicalDocument({ fileName: name, kind: "pdf", text: extracted.text, sourceBuf: buf, pages: extracted.pages, sigDetected });
    } else if (isImageFile(name, type)) {
      return await handleImageFile(file, buf, options);
    } else {
      if (isZip && window.fflate) {
        try {
          const files = fflate.unzipSync(new Uint8Array(buf));
          const hasDocXml = Object.keys(files).some(k => k.replace(/\\/g, "/").toLowerCase() === "word/document.xml");
          if (hasDocXml) {
            const text = extractDocxTextWithFflate(buf);
            if (!text || !text.trim()) throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
            return await buildCanonicalDocument({ fileName: name, kind: "docx", text, sourceBuf: buf });
          }
          const hasContentXml = Object.keys(files).some(k => k.toLowerCase() === "content.xml");
          if (hasContentXml) {
            const text = extractOdtText(buf);
            if (!text || !text.trim()) throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
            return await buildCanonicalDocument({ fileName: name, kind: "text", text, sourceBuf: buf });
          }
          const hasWbXml = Object.keys(files).some(k => k.replace(/\\/g, "/").toLowerCase() === "xl/workbook.xml");
          if (hasWbXml) {
            const extracted = await extractXlsx(buf);
            if (!extracted || !extracted.text || !extracted.text.trim()) throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
            return await buildCanonicalDocument({ fileName: name, kind: "xlsx", text: extracted.text, sourceBuf: buf, cellMap: extracted.cellMap });
          }
        } catch (zipErr) {
          if (zipErr instanceof DocumentIngestionError || (zipErr && zipErr.code)) throw zipErr;
        }
      }
      if (isBinaryBuffer(buf)) {
        throw new DocumentIngestionError(IngestErrorCode.UNSUPPORTED_BINARY, name);
      }
      const text = decodeTextBuffer(buf);
      if (!text || !text.trim()) {
        throw new DocumentIngestionError(IngestErrorCode.EMPTY_DOCUMENT, name);
      }
      return await buildCanonicalDocument({ fileName: name, kind: "text", text, sourceBuf: buf });
    }
  }

  async function ingestDocumentBatch(list, options = {}){
    const files = Array.from(list || []);
    const results = [];
    for (const f of files) {
      try {
        const doc = await ingestDocument(f, options);
        results.push({ ok: true, fileName: (f && f.name) || "document", doc });
      } catch (err) {
        results.push({ ok: false, fileName: (f && f.name) || "document", error: err });
      }
    }
    return results;
  }

  async function onFile(file){
    $("errLand").classList.add("hidden");
    $("errLand").textContent = "";
    try {
      const doc = await ingestDocument(file, {
        ocrEnabled: S.ocrEnabled,
        lang: S.lang,
        onProgress: showOcrProgress
      });
      applyDocumentToState(doc);
      return true;
    } catch (e) {
      const msg = localizeIngestError(e, file ? file.name : "");
      $("errLand").textContent = msg;
      $("errLand").classList.remove("hidden");
      toast(msg);
      return false;
    }
  }
  const Q = { items: [], cur: -1 };
  let QUEUE_LOAD_GENERATION = 0;
  const SNAP_KEYS = ["fileName","kind","text","sourceBuf","pages","noTextPages","cellMap","hashIn","hashOut","hits","reviewed","secondEyes","selectedId","filter","seen","sigDetected","analysisContext","settings"];
  const SNAP_SETTING_KEYS = ["profile","mode","suspicion","enabled","secrets","systems","projects","orgs","stripMeta","pdfaDecl","includeOutline","publicGlossary","truePdfRedact","ocrEnabled","expertMode","processAnalysis","quickMode","fastApprove","barPos"];

  function snapshotSettings(){
    const out = {};
    SNAP_SETTING_KEYS.forEach(k => {
      if (k === "enabled") out[k] = { ...(S.enabled || {}) };
      else out[k] = S[k];
    });
    return out;
  }

  function restoreSettingsSnapshot(snapshot){
    if (!snapshot) return;
    SNAP_SETTING_KEYS.forEach(k => {
      if (k === "enabled") S.enabled = { ...(snapshot.enabled || {}) };
      else if (Object.prototype.hasOwnProperty.call(snapshot, k)) S[k] = snapshot[k];
    });
    applyQuickMode();
    applyFastApprove();
    applyBarPos();
    syncSettingsForms();
  }

  function analysisContextKey(){
    return [
      S.hashIn || "",
      S.profile || "",
      S.mode || "",
      S.suspicion || "",
      JSON.stringify(S.enabled || {}),
      S.secrets || "",
      S.systems || "",
      S.projects || "",
      S.orgs || ""
    ].join("\u001f");
  }

  const snapState = () => {
    const o = {};
    SNAP_KEYS.forEach(k => {
      if (k === "hits") o[k] = Array.isArray(S[k]) ? S[k].map(h => ({ ...h })) : [];
      else if (k === "pages") o[k] = Array.isArray(S[k]) ? S[k].map(pg => ({ ...pg })) : [];
      else if (k === "cellMap") o[k] = Array.isArray(S[k]) ? S[k].map(cell => ({ ...cell })) : [];
      else if (k === "seen") o[k] = new Set(S[k] || []);
      else if (k === "sourceBuf" && S[k] && typeof S[k].slice === "function") o[k] = S[k].slice(0);
      else if (k === "settings") o[k] = snapshotSettings();
      else o[k] = S[k];
    });
    o.analysisContext = S.analysisContext || analysisContextKey();
    return o;
  };

  const restoreState = (o) => {
    if (!o) return;
    SNAP_KEYS.forEach(k => {
      if (k === "hits") S[k] = Array.isArray(o[k]) ? o[k].map(h => ({ ...h })) : [];
      else if (k === "pages") S[k] = Array.isArray(o[k]) ? o[k].map(pg => ({ ...pg })) : [];
      else if (k === "cellMap") S[k] = Array.isArray(o[k]) ? o[k].map(cell => ({ ...cell })) : [];
      else if (k === "seen") S[k] = new Set(o[k] || []);
      else if (k === "sourceBuf" && o[k] && typeof o[k].slice === "function") S[k] = o[k].slice(0);
      else if (k !== "settings") S[k] = o[k];
    });
    restoreSettingsSnapshot(o.settings);
    S.analysisContext = o.analysisContext || analysisContextKey();
  };

  function saveCurrent(){
    if (Q.cur >= 0 && Q.items[Q.cur] && (S.text || (S.kind === "pdf" && S.sourceBuf))) {
      Q.items[Q.cur].snap = snapState();
    }
  }

  async function onFiles(list){
    const files = Array.from(list || []);
    if (!files.length || S.movie) return;
    QUEUE_LOAD_GENERATION++;
    saveCurrent();
    const start = Q.items.length;
    files.forEach(f => Q.items.push({ name:f.name, file:f, snap:null }));
    await openQueueItem(start);
  }

  function removeQueueItem(idx){
    if (idx < 0 || idx >= Q.items.length) return;
    saveCurrent();
    const isCur = idx === Q.cur;
    Q.items.splice(idx, 1);
    if (!Q.items.length) {
      reset();
      return;
    }
    if (isCur) {
      const nextIdx = Math.min(idx, Q.items.length - 1);
      void openQueueItem(nextIdx);
    } else {
      if (Q.cur > idx) Q.cur--;
      renderQueue();
    }
  }

  async function openQueueItem(idx){
    const generation = ++QUEUE_LOAD_GENERATION;
    const it = Q.items[idx];
    if (!it) return;

    saveCurrent();
    const prevItem = Q.items[Q.cur] || null;
    Q.cur = idx;
    clearPdfVisual();

    if (it.snap) {
      if (generation !== QUEUE_LOAD_GENERATION || Q.items[idx] !== it) return;
      restoreState(it.snap);
      paint();
      return;
    }

    let ok = false;
    try {
      ok = await onFile(it.file);
    } catch (_) {
      ok = false;
    }

    if (generation !== QUEUE_LOAD_GENERATION || Q.items[idx] !== it || Q.cur !== idx) {
      return;
    }

    if (ok && (S.text || (S.kind === "pdf" && S.sourceBuf))) {
      it.snap = snapState();
      return;
    }

    const failedIndex = Q.items.indexOf(it);
    if (failedIndex >= 0) Q.items.splice(failedIndex, 1);
    Q.cur = -1;

    if (prevItem && Q.items.includes(prevItem) && prevItem.snap) {
      const backIndex = Q.items.indexOf(prevItem);
      Q.cur = backIndex;
      restoreState(prevItem.snap);
      paint();
      return;
    }

    if (Q.items.length > 0) {
      const nextIdx = Math.min(Math.max(0, failedIndex), Q.items.length - 1);
      await openQueueItem(nextIdx);
      return;
    }

    reset();
  }

  function renderQueue(){
    const bar = $("queueBar");
    if (!bar) return;
    if (Q.items.length < 2) {
      bar.classList.add("hidden");
      bar.innerHTML = "";
      return;
    }
    const t = i();
    const chips = Q.items.map((it, n) => {
      const rev = n === Q.cur ? S.reviewed : !!(it.snap && it.snap.reviewed);
      return `<span class="qchip-wrap"><button type="button" class="btn btn-sm btn-sec qchip${n===Q.cur?" active":""}" data-q="${n}" title="${escAttr(it.name)}" aria-pressed="${n===Q.cur}">${rev?"✓ ":""}${esc(it.name)}</button><button type="button" class="qchip-del" data-qdel="${n}" title="${escAttr(t.queueRemove || 'Odebrat')}" aria-label="${escAttr(t.queueRemove || 'Odebrat')}">×</button></span>`;
    }).join("");
    bar.innerHTML = `<span style="font-size:13px;color:var(--muted)">${t.queueLbl}:</span>${chips}<button type="button" class="btn btn-sm" id="qAll">${t.queueAll}</button>`;
    bar.classList.remove("hidden");
    bar.querySelectorAll("[data-q]").forEach(b => {
      b.onclick = () => {
        const n = +b.dataset.q;
        if (n !== Q.cur) void openQueueItem(n);
      };
    });
    bar.querySelectorAll("[data-qdel]").forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        const n = +b.dataset.qdel;
        removeQueueItem(n);
      };
    });
    $("qAll").onclick = exportAllReviewed;
  }

  function exportAllReviewed(){
    const t = i();
    saveCurrent();

    const ready = Q.items.filter(it => it && it.snap && it.snap.reviewed);
    if (!ready.length) {
      toast(t.queueNone);
      return;
    }

    const keepItem = Q.items[Q.cur] || null;
    openExport(false);

    const go = $("goExp");
    if (!go) return;

    go.onclick = async () => {
      go.disabled = true;
      go.textContent = t.exporting;
      let done = 0;
      let failed = 0;
      const batchReturnState = snapState();
      S._batchExport = true;
      try {
        for (const it of ready) {
          if (!it || !it.snap || !it.snap.reviewed) continue;
          let itemReturnState = null;
          try {
            itemReturnState = snapState();
            restoreState(it.snap);
            S._batchExport = true;
            S._exportNotice = null;
            S._aiPack = false;
            const ok = await doExport();
            if (ok) {
              const exportedHash = S.hashOut;
              it.snap = { ...it.snap, hashOut: exportedHash };
              done++;
            } else {
              failed++;
            }
          } catch (e) {
            failed++;
            console.error("Batch export failed:", it.name, e);
          } finally {
            S._exportNotice = null;
            S._aiPack = false;
            S._batchExport = true;
            if (itemReturnState) restoreState(itemReturnState);
          }
        }
      } finally {
        S._batchExport = false;
        restoreState(batchReturnState);
        if (keepItem) {
          const keepIndex = Q.items.indexOf(keepItem);
          if (keepIndex >= 0 && keepItem.snap) {
            Q.cur = keepIndex;
            restoreState(keepItem.snap);
          }
        }
        paint();
        $("exportModal").classList.add("hidden");
        go.disabled = false;
        go.textContent = t.export;
      }
      if (failed) {
        toast(t.queueDone.replace("{n}", String(done)) + " · " + String(failed) + " failed");
      } else {
        toast(t.queueDone.replace("{n}", String(done)));
      }
    };
  }

  function pdfWorker(){
    if (!window.pdfjsLib) throw new Error("PDF: knihovna se nenačetla.");
    if (window.__pdfWorkerReady) return window.__pdfWorkerReady;
    window.__pdfWorkerReady = (async () => {
      const local = "./lib/pdf.worker.min.js";
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = local;
      } catch (_) {}
      return "local";
    })();
    return window.__pdfWorkerReady;
  }
  async function getPdfDocument(data){

  const SRGB_ICC_PROFILE_BASE64 = "AAACTGxjbXMEQAAAbW50clJHQiBYWVogB+oACgABAAkAEQATYWNzcEFQUEwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1sY21zAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAAA2Y3BydAAAAUAAAABMd3RwdAAAAYwAAAAUY2hhZAAAAaAAAAAsclhZWgAAAcwAAAAUYlhZWgAAAeAAAAAUZ1hZWgAAAfQAAAAUclRSQwAAAggAAAAgZ1RSQwAAAggAAAAgYlRSQwAAAggAAAAgY2hybQAAAigAAAAkbWx1YwAAAAAAAAABAAAADGVuVVMAAAAaAAAAHABzAFIARwBCACAAYgB1AGkAbAB0AC0AaQBuAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAADAAAAAcAE4AbwAgAGMAbwBwAHkAcgBpAGcAaAB0ACwAIAB1AHMAZQAgAGYAcgBlAGUAbAB5WFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEIAAAXe///zJQAAB5MAAP2Q///7of///aIAAAPcAADAblhZWiAAAAAAAABvoAAAOPUAAAOQWFlaIAAAAAAAACSfAAAPhAAAtsNYWVogAAAAAAAAYpcAALeHAAAY2XBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbY2hybQAAAAAAAwAAAACj1wAAVHsAAEzNAACZmgAAJmYAAA9c";


  function base64ToUint8Array(base64){
    const clean = String(base64 || "").replace(/^data:.*?;base64,/, "").replace(/\s+/g, "");
    if (!clean) return new Uint8Array(0);
    const bin = atob(clean);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function pdfResolveObject(doc, obj){
    return obj ? doc.context.lookup(obj) : undefined;
  }

  function pdfFindFontDescriptor(doc, fontDict, seen){
    const { PDFDict, PDFArray, PDFName } = PDFLib;
    if (!(fontDict instanceof PDFDict)) return null;
    seen = seen || new Set();

    const key = fontDict.toString();
    if (seen.has(key)) return null;
    seen.add(key);

    const direct = fontDict.get(PDFName.of("FontDescriptor"));
    if (direct) return pdfResolveObject(doc, direct);

    const descendants = fontDict.lookupMaybe(PDFName.of("DescendantFonts"), PDFArray);
    if (descendants) {
      for (let i = 0; i < descendants.size(); i++) {
        const d = descendants.lookup(i);
        const found = pdfFindFontDescriptor(doc, d, seen);
        if (found) return found;
      }
    }
    return null;
  }

  function pdfFontIsEmbedded(doc, fontDict){
    const { PDFDict, PDFName } = PDFLib;
    const descriptor = pdfFindFontDescriptor(doc, fontDict);
    if (!(descriptor instanceof PDFDict)) return false;
    return Boolean(
      descriptor.get(PDFName.of("FontFile")) ||
      descriptor.get(PDFName.of("FontFile2")) ||
      descriptor.get(PDFName.of("FontFile3"))
    );
  }

  function inspectPdfFontEmbedding(pdfDoc){
    const { PDFDict, PDFName } = PDFLib;
    const result = [];

    pdfDoc.getPages().forEach((page, pageIndex) => {
      const resources = page.node.Resources();
      if (!resources) return;

      const fonts = resources.lookupMaybe(PDFName.of("Font"), PDFDict);
      if (!fonts) return;

      for (const [name] of fonts.entries()) {
        const font = fonts.lookup(PDFName.of(name));
        result.push({
          page: pageIndex + 1,
          name,
          embedded: pdfFontIsEmbedded(pdfDoc, font)
        });
      }
    });

    return result;
  }



  function addSrgbOutputIntent(pdfDoc){
    const { PDFName } = PDFLib;
    const iccBytes = base64ToUint8Array(SRGB_ICC_PROFILE_BASE64);
    if (!iccBytes.length) throw new Error("Missing sRGB ICC profile");

    /*
     * ICC profile stream:
     *   /N 3
     *
     * The profile itself remains an ordinary PDF stream and is referenced by
     * /DestOutputProfile from the OutputIntent dictionary.
     */
    const iccStream = pdfDoc.context.stream(iccBytes, { N: 3 });
    const iccRef = pdfDoc.context.register(iccStream);

    const intentDict = pdfDoc.context.obj({
      Type: "OutputIntent",
      S: "GTS_PDFA1",
      OutputConditionIdentifier: "sRGB IEC61966-2.1",
      RegistryName: "http://www.color.org",
      Info: "sRGB IEC61966-2.1",
      DestOutputProfile: iccRef
    });

    const intentRef = pdfDoc.context.register(intentDict);
    pdfDoc.catalog.set(PDFName.of("OutputIntents"), pdfDoc.context.obj([intentRef]));

    return { iccRef, intentRef };
  }


  async function applyPdfaDeclaration(bytes){
    const { PDFDocument, PDFName } = PDFLib;
    const doc = await PDFDocument.load(bytes, { updateMetadata:false });

    const fontAudit = inspectPdfFontEmbedding(doc);
    const unembeddedPages = [...new Set(fontAudit.filter(f => !f.embedded).map(f => f.page))];

    addSrgbOutputIntent(doc);

    const xmp = '<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?>' +
      '<x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">' +
      '<rdf:Description rdf:about="" xmlns:pdfaid="http://www.aiim.org/pdfa/ns/id/" xmlns:xmp="http://ns.adobe.com/xap/1.0/">' +
      '<pdfaid:part>2</pdfaid:part><pdfaid:conformance>B</pdfaid:conformance>' +
      '<xmp:CreatorTool>Znečitelně</xmp:CreatorTool>' +
      '</rdf:Description></rdf:RDF></x:xmpmeta><?xpacket end="w"?>';

    const stream = doc.context.stream(xmp, { Type:"Metadata", Subtype:"XML" });
    doc.catalog.set(PDFName.of("Metadata"), doc.context.register(stream));

    const out = await doc.save({ useObjectStreams:false });
    return {
      bytes: out,
      fontAudit,
      unembeddedPages
    };
  }

  async function getCleanExportHtml() {
    if (/^https?:/i.test(location.protocol)) {
      const candidates = ["/znecitelne.html", "./znecitelne.html", location.pathname, location.href];
      for (const url of candidates) {
        try {
          const res = await fetch(url, { cache: "no-cache" });
          if (res.ok) {
            const txt = await res.text();
            if (txt.includes("<!DOCTYPE html>") && txt.includes("Znečitelně") && txt.includes("PII_KEYS") && txt.length > 50000) {
              return txt;
            }
          }
        } catch (_) {}
      }
    }

    if (PRISTINE_HTML && PRISTINE_HTML.length > 50000 && PRISTINE_HTML.includes("<!DOCTYPE") && PRISTINE_HTML.includes("PII_KEYS")) {
      return PRISTINE_HTML;
    }

    return buildSanitizedHtml();
  }

  function isIgnoredSystemFile(name){
    if (!name) return true;
    const base = name.split("/").pop().split("\\").pop();
    return base.startsWith("~$") || base.startsWith("._") || base === ".DS_Store" || base === "Thumbs.db" || base === "desktop.ini";
  }

  async function collectFilesFromDataTransfer(dt){
    if (!dt) return [];
    const items = dt.items;
    if (!items || !items.length) {
      return Array.from(dt.files || []).filter(f => !isIgnoredSystemFile(f.name));
    }
    const files = [];
    async function scanEntry(entry){
      if (!entry) return;
      if (entry.isFile) {
        return new Promise(res => {
          try {
            entry.file(f => {
              if (f && !isIgnoredSystemFile(f.name)) files.push(f);
              res();
            }, () => res());
          } catch (_) { res(); }
        });
      }
      if (entry.isDirectory) {
        try {
          const reader = entry.createReader();
          const readEntries = () => new Promise(res => {
            reader.readEntries(async entries => {
              if (!entries || !entries.length) return res();
              for (const c of entries) await scanEntry(c);
              await readEntries();
              res();
            }, () => res());
          });
          await readEntries();
        } catch (_) {}
      }
    }
    const promises = [];
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (typeof it.webkitGetAsEntry === "function") {
        let entry = null;
        try { entry = it.webkitGetAsEntry(); } catch (_) {}
        if (entry) { promises.push(scanEntry(entry)); continue; }
      }
      const f = it.getAsFile ? it.getAsFile() : null;
      if (f && !isIgnoredSystemFile(f.name)) files.push(f);
    }
    if (promises.length) await Promise.all(promises);
    return files.length ? files : Array.from(dt.files || []).filter(f => !isIgnoredSystemFile(f.name));
  }

  function marqueeDurationSec(shiftPx){

  function initActionMarquees(root){
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    (root || document).querySelectorAll(".action-marquee").forEach(el => {
      const inner = el.querySelector(".action-marquee-inner");
      if (!inner) return;
      el.classList.remove("marquee-active");
      el.style.removeProperty("--marquee-duration");
      if (reduce) return;
      if (inner.scrollWidth > el.clientWidth + 2) {
        const shift = inner.scrollWidth + el.clientWidth;
        el.style.setProperty("--marquee-duration", marqueeDurationSec(shift) + "s");
        el.classList.add("marquee-active");
      }
    });
  }
  function startTextMarquee(chip){
    if (!chip) return;
    chip.classList.remove("marquee");
    chip.style.removeProperty("--chip-marquee-duration");
    chip.style.removeProperty("--chip-marquee-shift");
    const existingTrack = chip.querySelector(".chip-track");
    if (existingTrack) {
      const original = existingTrack.querySelector(".chip-content:not(.chip-content-clone)");
      if (original) chip.replaceChild(original, existingTrack);
    }
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    requestAnimationFrame(() => {
      const content = chip.querySelector(".chip-content");
      if (!content) return;
      const contentWidth = content.scrollWidth;
      const chipWidth = chip.clientWidth || chip.parentElement && chip.parentElement.clientWidth || 0;
      if (reduce || contentWidth <= chipWidth + 2 || chipWidth < 24) return;
      const GAP = 32;
      const track = document.createElement("span");
      track.className = "chip-track";
      const clone = content.cloneNode(true);
      clone.classList.add("chip-content-clone");
      clone.setAttribute("aria-hidden", "true");
      chip.replaceChild(track, content);
      track.appendChild(content);
      track.appendChild(clone);
      const shift = contentWidth + GAP;
      chip.style.setProperty("--chip-marquee-shift", shift + "px");
      chip.style.setProperty("--chip-marquee-duration", marqueeDurationSec(shift) + "s");
      chip.classList.add("marquee");
    });
  }

  function movieObstructions(){

    ["header.app", "#bar", "#quickHitBar"].forEach(sel => {
      const e = document.querySelector(sel);
      if (!e || e.classList.contains("hidden")) return;
      const pos = getComputedStyle(e).position;
      if (pos !== "sticky" && pos !== "fixed") return;
      const r = e.getBoundingClientRect();
      if (r.height <= 0 || r.width < window.innerWidth * 0.6) return;
      if (r.top + r.height / 2 < window.innerHeight / 2) top = Math.max(top, r.bottom);
      else bottom = Math.min(bottom, r.top);

    return { top, bottom };
  }

    return r.bottom > 0 && r.top < window.innerHeight && r.right > 0 && r.left < window.innerWidth;
  }
  function movieClearlyVisible(el, obs){
    const r = el.getBoundingClientRect();
    let top = 0, bottom = window.innerHeight;
    if (!el.closest("#bar, header.app, #quickHitBar, .modal")) { top = obs.top; bottom = obs.bottom; }
    for (let p = el.parentElement; p && p !== document.body; p = p.parentElement) {
      if (!/(auto|scroll)/.test(getComputedStyle(p).overflowY) || p.scrollHeight <= p.clientHeight + 1) continue;
      const pr = p.getBoundingClientRect();
      top = Math.max(top, pr.top); bottom = Math.min(bottom, pr.bottom);

  function movieReveal(els){
    const cap = $("movie-caption-bar");
    cap.classList.remove("movie-cap-top");
    const first = els[0];
    if (!first || first.closest("#movie-controls, #movie-caption-bar")) return;
    const fixedSel = "#bar, header.app, #quickHitBar";
    const inFixed = !!first.closest(fixedSel);
    const inModal = !!first.closest(".modal");
    const sheet = inModal ? (first.closest(".sheet") || first.closest(".modal")) : null;
    try {
      first.scrollIntoView({ block: inFixed ? "nearest" : "center", inline: "nearest", behavior: "auto" });
    } catch (_) {}
    const pageEls = els.filter(e => !e.closest(fixedSel + ", .modal"));
    const obs = movieObstructions();
    const controlsTop = $("movie-controls").getBoundingClientRect().top;
    const tryOption = (capTop) => {
      cap.classList.toggle("movie-cap-top", capTop);
      const cr = cap.getBoundingClientRect();
      let lo = obs.top + 8, hi = obs.bottom - 8;
      if (capTop) { lo = Math.max(lo, cr.bottom + 8); hi = Math.min(hi, controlsTop - 8); }
      else hi = Math.min(hi, cr.top - 8);
      if (inModal && sheet && sheet.scrollHeight > sheet.clientHeight) {
        if (hi > lo) {
          const rects = els.map(e => e.getBoundingClientRect());
          let t = Math.min(...rects.map(r => r.top)), b = Math.max(...rects.map(r => r.bottom));
          if (b - t > hi - lo) { t = rects[0].top; b = rects[0].bottom; }
          const delta = (t + b) / 2 - (lo + hi) / 2;
          if (Math.abs(delta) > 2) sheet.scrollTop += delta;
        }
      } else if (!inFixed && !inModal && pageEls.length) {
        if (hi > lo) {
          const rects = pageEls.map(e => e.getBoundingClientRect());
          let t = Math.min(...rects.map(r => r.top)), b = Math.max(...rects.map(r => r.bottom));
          if (b - t > hi - lo) { t = rects[0].top; b = rects[0].bottom; }
          const delta = (t + b) / 2 - (lo + hi) / 2;
          if (Math.abs(delta) > 2) window.scrollBy(0, delta);

      }
      const o = movieObstructions();
      return els.filter(e => movieCovered(e)).length * 10 + els.filter(e => !movieClearlyVisible(e, o)).length;
    };
    const s0 = tryOption(false);

    const s1 = tryOption(true);

    tryOption(false);

    const ch = typeof step.chapter === "function" ? step.chapter() : (step.chapter || "");
    const cap = typeof step.caption === "function" ? step.caption() : (step.caption || "");
    $("movie-chapter-label").textContent = ch;
    $("movie-caption-text").textContent = cap;
    const pct = total ? Math.round(((idx + 1) / total) * 100) : 0;
    const fill = $("movie-progress-fill");
    if (fill) fill.style.width = pct + "%";
    const label = $("movie-progress-label");
    if (label) label.textContent = movieCaption(`Krok ${idx + 1} z ${total}`, `Step ${idx + 1} of ${total}`);
    movieCloseTitleCard();
    if (ch) {
      $("movie-title-h").textContent = ch;
      $("movie-title-p").textContent = cap;
      $("movie-title-card").classList.add("show");
      movieScheduleTitleClose(2200);
    }
  }

  async function runMovieStep(generation = MOVIE_GENERATION){
    if (!S.movie || generation !== MOVIE_GENERATION) return;
    const idx = S.movieStepIndex || 0;
    const step = ACTIVE_MOVIE_SCRIPT[idx];
    if (!step) { exitMovieTutorial(true); return; }

    movieResetForStep(idx);
    if (!S.movie || generation !== MOVIE_GENERATION) return;

    movieShowCaption(step, idx, ACTIVE_MOVIE_SCRIPT.length);
    if (step.setup) await step.setup();
    if (!S.movie || generation !== MOVIE_GENERATION || S.movieStepIndex !== idx) return;

    $("movie-btn-back").disabled = idx === 0;
    if (typeof step.highlight !== "function") movieHighlight(step.highlight);
    else if (step.preHighlight) movieHighlight(step.preHighlight);
    else movieClearPulse();

    const go = () => {
      if (!S.movie || generation !== MOVIE_GENERATION || S.movieStepIndex !== idx) return;
      movieHighlight(step.highlight);
      const hold = step.holdMs || 4000;
      movieSetTimeout(() => {
        if (!S.movie || generation !== MOVIE_GENERATION || S.movieStepIndex !== idx) return;
        if (step.finish) {
          step.finish();
          return;
        }
        movieGoTo(idx + 1);
      }, hold);
    };
    go();
  }

  async function movieGoTo(targetIdx){
    if (!S.movie || MOVIE_TRANSITION_LOCK) return;
    const total = ACTIVE_MOVIE_SCRIPT.length;
    const idx = Math.max(0, Math.min(total - 1, Number(targetIdx) || 0));
    MOVIE_TRANSITION_LOCK = true;
    const generation = ++MOVIE_GENERATION;
    movieCancelPlayback();
    movieClearSelectMenu();
    S.movieStepIndex = idx;
    try {
      await runMovieStep(generation);
    } finally {
      if (generation === MOVIE_GENERATION) MOVIE_TRANSITION_LOCK = false;
    }
  }

  function movieTogglePause(){
    if (!S.movie) return;
    MOVIE_PAUSED = !MOVIE_PAUSED;
    document.body.classList.toggle("movie-paused", MOVIE_PAUSED);
    $("movie-btn-playpause").textContent = MOVIE_PAUSED ? "▶️" : "⏸️";
    if (MOVIE_PAUSED) {
      if (MOVIE_TIMER) clearTimeout(MOVIE_TIMER);
      MOVIE_TIMER = null;
      if (MOVIE_PENDING) {
        const elapsedReal = Date.now() - MOVIE_PENDING.startedAt;
        MOVIE_PENDING.remainingMs -= elapsedReal * movieEffectiveSpeed();
        if (MOVIE_PENDING.remainingMs < 0) MOVIE_PENDING.remainingMs = 0;
      }
    } else {
      scheduleMoviePending();
    }
  }
  function movieToggleSpeed(){
    const oldSpeed = movieEffectiveSpeed();
    MOVIE_SPEED = MOVIE_SPEED === 1 ? 1.75 : 1;
    $("movie-btn-speed").textContent = MOVIE_SPEED === 1 ? "1×" : "1,75×";
    if (MOVIE_PENDING && !MOVIE_PAUSED) {
      if (MOVIE_TIMER) clearTimeout(MOVIE_TIMER);
      MOVIE_TIMER = null;
      const elapsedReal = Date.now() - MOVIE_PENDING.startedAt;
      MOVIE_PENDING.remainingMs -= elapsedReal * oldSpeed;
      if (MOVIE_PENDING.remainingMs < 0) MOVIE_PENDING.remainingMs = 0;
      scheduleMoviePending();
    }
  }
  async function movieSkipStep(){
    if (!S.movie || MOVIE_TRANSITION_LOCK) return;
    const idx = S.movieStepIndex || 0;
    if (idx >= ACTIVE_MOVIE_SCRIPT.length - 1) {
      exitMovieTutorial(true);
      return;
    }
    await movieGoTo(idx + 1);
  }
  async function movieBackStep(){
    if (!S.movie || MOVIE_TRANSITION_LOCK) return;
    const idx = S.movieStepIndex || 0;
    if (idx <= 0) return;
    await movieGoTo(idx - 1);
  }

  function exitMovieTutorial(keepDoc){
    MOVIE_GENERATION++;
    MOVIE_TRANSITION_LOCK = false;
    movieCancelPlayback();
    movieClearSelectMenu();
    S.movie = false;
    if (MOVIE_PREV) {
      S.quickMode = MOVIE_PREV.quick; S.fastApprove = MOVIE_PREV.fast; MOVIE_PREV = null;
      applyQuickMode();
      syncSettingsForms();
    }
    hideMovieUI();
    document.querySelectorAll(".modal").forEach(m => m.classList.add("hidden"));
    if (!keepDoc) reset();
    else paint();
  }

          !extractRtfText("{\\rtf1\\ansi\\ansicpg1250{\\*\\generator App}\\pard Smlouva o d\\'edle.\\par \\ldblquote Objednatel\\rdblquote : Jan Nov\\'e1k\\bullet Hotovo\\par}").includes("generator"),

    S.systems = prevSys; S.projects = prevProj;

    cases.push({

    });
    const failed = cases.filter(c => !c.ok);
    return { ok: failed.length===0, failed, n: cases.length };
  }

  try {
