<style>
:root {

* { box-sizing: border-box; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

.queue .qchip-del { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:0 8px; border-radius:0 999px 999px 0; border:1.5px solid var(--border); border-left:1px solid color-mix(in srgb, var(--border) 50%, transparent); background:var(--surface); color:var(--muted); font-size:15px; font-weight:700; cursor:pointer; line-height:1; }

.ok { color: var(--ok); font-weight: 600; } .danger { color: var(--danger); font-weight: 600; }

.process { font-size: 13px; line-height: 1.45; max-height: 22rem; overflow: auto; }
.process h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; font-family: var(--font); }
.process ul { margin: 0; padding-left: 1.1rem; }
.process .token { font-family: var(--mono); font-size: 12px; }
.leak-ok { color: var(--ok); }
.leak-bad { color: var(--danger); }
.layer-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.dict-hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

/* Quick mode: hide secondary UI, keep only the essentials to finish a redaction pass */
body.quick-mode #landingSteps,
body.quick-mode #landingSettingsDetails,
body.quick-mode #filters,
body.quick-mode #hitList,
body.quick-mode #processPane,
body.quick-mode .bar #chk2,
body.quick-mode .bar label:has(#chk2),
body.quick-mode .bar .bulk-group,
body.quick-mode .bar #btnAll,
body.quick-mode .bar #btnNone,
body.quick-mode .bar #btnOff,
body.quick-mode .bar #btnAudit,
body.fast-approve .bar #chk2,
body.fast-approve .bar label:has(#chk2),
body.fast-approve .bar #chkRev,
body.fast-approve .bar label:has(#chkRev) {
  display: none !important;
}
body.quick-mode .work { grid-template-columns: 1fr; }
body.quick-mode #reviewAside { display: contents; }
body.quick-mode #inspector { display: none !important; }
body.quick-mode .toolbar { gap: 6px; }
body.quick-mode header.app .hdr-actions #btnHtml,
body.quick-mode header.app .hdr-actions #btnLang,
body.quick-mode header.app .hdr-actions #btnHelp {
  display: none !important;
}

#quickHitBar { padding: 12px; }
#quickHitBar .qh-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: stretch; gap: 10px;
}
#quickHitBar .qh-val {
  display: block; width: 100%; min-width: 0;
  font-family: var(--mono); font-size: 13px; line-height: 1.45;
  overflow-wrap: anywhere; word-break: break-word; white-space: normal;
}
#quickHitBar .qh-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--header-muted); display: block; margin-bottom: 2px;
  font-family: var(--font);
}
#quickHitBar .qh-actions {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
#quickHitBar .qh-navs { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
#quickHitBar .qh-nav {
  min-width: 36px; min-height: 36px; padding: 0 12px;
  font-size: 13px; line-height: 1;
  background: var(--surface); color: var(--fg);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--on-primary) 32%, transparent);
}
#quickHitBar .qh-nav .qh-arrow {
  display: block;
  font-size: 140%;
  font-weight: 900;
  line-height: 1;
}
#quickHitBar .qh-nav:hover { background: var(--bg); border-color: var(--bg); }
/* Quick-mode hit card floats above the (still visible) export bar rather than replacing it */
body.quick-mode.hit-selected #quickHitBar[data-pos="bottom"] { bottom: calc(var(--export-bar-h, 60px) + 8px); }
body.quick-mode.hit-selected #quickHitBar[data-pos="top"] { top: calc(var(--hdr-h, 60px) + var(--export-bar-h, 60px) + 8px); }


[inert] { opacity: .45; filter: grayscale(.15); pointer-events: none; }
body.movie-active [inert] {
  opacity: 1;
  filter: none;
}
#movie-caption-bar {
  display: none; position: fixed; left: 16px; right: 16px; bottom: 68px; z-index: 70;
  max-width: 720px; margin: 0 auto; padding: 12px 16px; border-radius: 14px;
  max-height: 42dvh; overflow-y: auto;
  background: color-mix(in srgb, var(--header-bg) 92%, transparent);
  color: var(--header-fg); box-shadow: 0 12px 40px rgba(14,16,20,.28);
  border: 1px solid color-mix(in srgb, var(--header-fg) 22%, transparent);
}
#movie-caption-bar.active { display: block; }
body.bar-pos-bottom #movie-caption-bar { bottom: calc(var(--bar-h, 72px) + 68px); }
body.bar-pos-bottom #movie-controls { bottom: calc(var(--bar-h, 72px) + 16px); }
#movie-caption-bar.movie-cap-top { bottom: auto; top: 12px; }
#movie-chapter-label {
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--header-muted); margin-bottom: 4px;
}
#movie-caption-text {
  font-size: 15px; line-height: 1.5;
  white-space: normal; word-wrap: break-word; overflow-wrap: anywhere;
}
.movie-progress {
  margin-top: 8px; height: 4px; border-radius: 999px;
  background: color-mix(in srgb, var(--header-fg) 18%, transparent);
  overflow: hidden;
}
.movie-progress-fill { height: 100%; background: var(--header-fg); transition: width .25s ease; }
.movie-progress-label { margin-top: 4px; font-size: 11px; color: var(--header-muted); }
.chip-track {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  animation: chipMarquee var(--chip-marquee-duration, 8s) linear infinite;
}
.chip-content-clone { margin-left: 32px; }
@keyframes chipMarquee {
  from { transform: translateX(0); }
  to { transform: translateX(calc(-1 * var(--chip-marquee-shift, 0px))); }
}
.wrap-line, .hit-value, .insp-marquee {
  display: block;
  width: 100%;
  min-width: 0;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
}
body.movie-paused .chip-track,
body.movie-paused .movie-pulse {
  animation-play-state: paused !important;
}
@media (prefers-reduced-motion: reduce) {
  .chip-track { animation: none !important; padding-left: 0; }
}
#movie-controls {
  display: none; position: fixed; right: 16px; bottom: 16px; z-index: 71;
  gap: 6px; align-items: center;
}
#movie-controls.active { display: flex; }
#movie-controls button {
  min-height: 40px; padding: 0 12px; border-radius: 999px;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--fg);
  font: 13px/1 var(--font); font-weight: 600;
}
#movie-title-card {
  display: none; position: fixed; inset: 0; z-index: 72; place-items: center;
  background: var(--overlay); padding: 24px;
}
#movie-title-card.show { display: grid; }
#movie-title-card .sheet { text-align: center; max-width: 420px; }
#movie-select-menu {
  display: none; position: fixed; z-index: 95; min-width: 240px; max-width: min(520px, calc(100vw - 24px));
  max-height: min(52dvh, 420px); overflow: auto; padding: 6px;
  background: var(--surface); color: var(--fg); border: 1.5px solid var(--border);
  border-radius: 10px; box-shadow: 0 12px 36px rgba(14,16,20,.28);
}
#movie-select-menu.active { display: block; }
.movie-select-menu-title {
  padding: 6px 10px 5px; font-size: 10px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
.movie-select-option {
  display: block; width: 100%; min-height: 40px; padding: 8px 10px; border: 0; border-radius: 7px;
  background: transparent; color: var(--fg); text-align: left; font: inherit; cursor: default;
}
.movie-select-option.is-selected { font-weight: 750; box-shadow: inset 3px 0 0 var(--focus); background: var(--bg-subtle); }
.movie-select-option.is-focus { outline: 3px solid var(--focus); outline-offset: -3px; background: color-mix(in srgb, var(--focus) 12%, var(--surface)); }
@media (max-width: 640px) {
  #movie-select-menu { max-width: calc(100vw - 20px); max-height: min(48dvh, 360px); }
  .movie-select-option { min-height: 42px; }
}

body.movie-active #settingsSheet {
  padding-top: 36px;
  padding-bottom: 220px;
}
#movie-title-card h2 { margin: 0 0 8px; font-size: 1.6rem; }
.movie-pulse {
  outline: 3px solid var(--focus) !important;
  animation: moviePulse 1.1s ease-in-out infinite;
  position: relative; z-index: 5;
}
@keyframes moviePulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--focus) 50%, transparent); }
  50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--focus) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce) {
  .movie-pulse { animation: none; }
}
</style>
</head>
<body>
<div id="tip" role="tooltip"></div>
<div class="toast" id="toast"></div>
<div id="movie-caption-bar" aria-live="polite">
  <div id="movie-chapter-label"></div>
  <div id="movie-caption-text"></div>
  <div class="movie-progress" aria-hidden="true"><div id="movie-progress-fill" class="movie-progress-fill"></div></div>
  <div id="movie-progress-label" class="movie-progress-label"></div>
</div>
<div id="movie-controls">
  <button type="button" id="movie-btn-back" disabled>⏮️</button>
  <button type="button" id="movie-btn-playpause">⏸️</button>
  <button type="button" id="movie-btn-skip">⏭️</button>
  <button type="button" id="movie-btn-speed">1×</button>
  <button type="button" id="movie-btn-exit">✖️</button>
</div>
<div id="movie-title-card"><div class="sheet"><h2 id="movie-title-h"></h2><p id="movie-title-p" style="color:var(--muted)"></p></div></div>
<div id="movie-select-menu" aria-hidden="true"></div>
<header class="app">
  <div class="brand">
    <div class="mark">Z</div>
    <div>
      <h1 style="margin:0;font-size:18px" id="title">Znečitelně</h1>
      <p class="tag" id="tagline"></p>
    </div>
  </div>
  <div class="hdr-actions">
    <button class="btn btn-sm btn-file" id="btnNewFile" type="button"><span class="plus" aria-hidden="true">+</span><span id="lblNewFile">Nový soubor</span></button>
    <button class="btn btn-sm btn-ghost" id="btnTheme" type="button" aria-pressed="false" aria-label="Tmavý režim">☾</button>
    <button class="btn btn-sm btn-ghost" id="btnSettings" type="button" aria-label="Nastavení">⚙</button>
    <button class="btn btn-sm btn-ghost" id="btnHtml" type="button">HTML</button>
    <button class="btn btn-sm btn-ghost" id="btnLang" type="button">EN</button>
    <button class="btn btn-sm btn-ghost" id="btnHelp" type="button">?</button>
  </div>
</header>

<section id="landing" class="wrap">
  <div class="grid-landing">
    <div>
      <p class="lead" id="lead"></p>
      <ol class="steps" id="landingSteps">
        <li><span class="num">1</span><span id="s1"></span></li>
        <li><span class="num">2</span><span id="s2"></span></li>
        <li><span class="num">3</span><span id="s3"></span></li>
      </ol>
      <p class="privacy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span id="privacy"></span></p>
    </div>
    <div class="card">
      <div class="drop" id="drop">
        <p style="font-weight:600;margin:0" id="dropTitle"></p>
        <p style="color:var(--muted);font-size:14px;margin:8px 0 0" id="dropHint"></p>
      </div>
      <input id="file" type="file" multiple hidden accept=".pdf,.docx,.xlsx,.xls,.ods,.odt,.rtf,.txt,.csv,.tsv,.json,.xml,.html,.htm,.md,.png,.jpg,.jpeg,.webp,.bmp,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/vnd.oasis.opendocument.spreadsheet,application/vnd.oasis.opendocument.text,application/rtf,text/rtf,text/plain,text/csv,image/*" />
      <div class="stack">
        <button class="btn" id="btnSample" type="button"></button>
        <button class="btn btn-sec" id="btnMovie" type="button"></button>
        <button class="btn btn-sec" id="btnBrowse" type="button"></button>
        <button class="btn btn-ghost" id="btnFeatures" type="button"></button>
        <button class="btn btn-ghost" id="btnChangelog" type="button"></button>
      </div>
      <details class="settings" id="landingSettingsDetails">
        <summary id="sumSettings"></summary>
        <div id="settingsMount"></div>
      </details>
      <p class="danger hidden" id="errLand"></p>
    </div>
  </div>
</section>

<section id="review" class="review hidden">
  <div id="queueBar" class="queue hidden" role="group"></div>
  <div class="toolbar" id="toolbar"></div>
  <p id="residual" class="ok hidden"></p>
  <p id="scanWarn" class="danger hidden"></p>
  <p id="sigWarn" class="danger hidden" role="alert"></p>
  <div class="work">
    <div class="pane">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
        <h2 class="lbl" style="margin:0" id="lblOrig"></h2>
        <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <button class="btn btn-sm btn-sec btn-visual hidden" id="btnVisual" type="button"></button>
          <button class="btn btn-sm btn-add-sel" id="btnAdd" type="button"></button>
        </span>
      </div>
      <pre class="doc" id="orig"></pre>
      <div id="pdfVisual" class="hidden" aria-label="PDF"></div>
    </div>
    <aside id="reviewAside">
      <div class="filters" id="filters"></div>
      <div class="hits" id="hitList"></div>
      <div class="pane" id="inspector" style="margin-top:12px"></div>
      <div class="pane hidden" style="margin-top:12px" id="processPane">
        <h2 class="lbl" id="lblProc"></h2>
        <div class="process" id="processBox"></div>
      </div>
      <div class="pane hidden" style="margin-top:12px" id="mediaPane">
        <h2 class="lbl" id="lblMedia">Obrázky a podpisy</h2>
        <div class="media-box" id="mediaBox" style="font-size:12px;display:flex;flex-direction:column;gap:6px"></div>
      </div>
    </aside>
  </div>
</section>

<div class="bar hidden" id="quickHitBar"></div>
<div class="bar hidden" id="bar"></div>
<footer id="footer"></footer>

<div class="modal hidden" id="helpModal">
  <div class="sheet" id="helpSheet"></div>
</div>
<div class="modal hidden" id="featuresModal">
  <div class="sheet" id="featuresSheet" style="max-height:min(90dvh,720px);overflow:auto"></div>
</div>
<div class="modal hidden" id="changelogModal">
  <div class="sheet" id="changelogSheet"></div>
</div>
<div class="modal hidden" id="exportModal">
  <div class="sheet" id="exportSheet"></div>
</div>
<div class="modal hidden" id="settingsModal">
  <div class="sheet" id="settingsSheet" style="max-height:min(90dvh,720px);overflow:auto">
    <h2 id="settingsTitle" style="margin-top:0"></h2>
    <div id="settingsModalMount"></div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn" id="btnSettingsApply" type="button"></button>
      <button class="btn btn-sec" id="btnSettingsClose" type="button"></button>
    </div>
  </div>
</div>
